name: mediaengine-realmusic
# MediaEngine "cuts on the beat" with REAL music (public Wikimedia Commons recordings with free licences - never the
# owner's music): MediaEngine's beat finder against librosa's (an independent reference in its own venv, CI only),
# and reels of the synthetic fixtures with that music through the real engine. No owner media, no secrets.
# Results: branch mediaengine-realmusic-results (JSON + attribution).
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/app/archivist/engine_p11/p13_beats.py'
      - 'mediaengine/tests/real_music_check.py'
      - 'mediaengine/tests/real_music_manifest.json'
      - '.github/workflows/mediaengine-realmusic.yml'
permissions:
  contents: write
concurrency:
  group: mediaengine-realmusic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the program's pins, and librosa in its own venv (reference only)
        run: |
          python -m pip install --disable-pip-version-check -q -r mediaengine/requirements.txt
          python -m venv "$RUNNER_TEMP/ref"
          "$RUNNER_TEMP/ref/bin/python" -m pip install -q librosa soundfile
      - name: Synthetic fixtures (videos for the reels)
        run: python mediaengine/tests/make_fixtures.py "$RUNNER_TEMP/fx"
      - name: Real music from Commons - beats against librosa, reels with that music
        env:
          MEDENG_REF_PYTHON: ${{ runner.temp }}/ref/bin/python
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python mediaengine/tests/real_music_check.py "$RUNNER_TEMP/rm" --out "$RUNNER_TEMP/out" --fixtures "$RUNNER_TEMP/fx" 2>&1 | tee "$RUNNER_TEMP/out/real_music.txt"
          exit ${PIPESTATUS[0]}
      - name: Publish results to branch mediaengine-realmusic-results
        if: success() || failure()
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir -p "$pub/latest"
          cp "$RUNNER_TEMP"/out/*.json "$RUNNER_TEMP"/out/*.md "$RUNNER_TEMP"/out/*.txt "$pub/latest/" 2>/dev/null || true
          printf 'sha=%s\nrun=%s\nstatus=%s\n' "$SRC_SHA" "$RUN_ID" "$JOB_STATUS" > "$pub/latest/RUN.txt"
          cd "$pub"; git init -q; git checkout -q -b mediaengine-realmusic-results
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine real music run $RUN_ID ($SRC_SHA) $JOB_STATUS"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-realmusic-results
