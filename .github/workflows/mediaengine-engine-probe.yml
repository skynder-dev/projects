name: mediaengine-engine-probe
# Can another free voice engine run the way MediaEngine's voice add-on runs - Windows, Python 3.11, CPU torch 2.8 (the
# add-on's own torch) - and what exactly does it import? One sentence in the program's 9_2 voice (a designed voice, no
# person), the time on a CPU, the distributions really imported. Not the product: it tells what shipping the engine
# the owner picks from voice lab round 14 would take. Results: branch mediaengine-voice-lab probe/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/engine_probe.py'
      - '.github/workflows/mediaengine-engine-probe.yml'
permissions:
  contents: write
concurrency:
  group: mediaengine-engine-probe-${{ github.ref }}
  cancel-in-progress: true
env:
  CPU_TORCH: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_PROGRESS_BAR: 'off'
jobs:
  # Run 39601510428 (probe/): both Qwen3-TTS and Chatterbox ran on Windows on CPU torch 2.8. The owner picked 14_5
  # (Qwen3-TTS) on 2026-10-21. Now: the pinned commit and the exact files of the Qwen model, for the add-on.
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The Qwen3-TTS 1.7B Base model at its current commit (files, sizes, hashes) - what the add-on will pin
        run: |
          python -m pip install -q "huggingface_hub>=0.36"
          mkdir -p "$RUNNER_TEMP/out"
          python - <<'PY' > "$RUNNER_TEMP/out/model_info_qwen.json"
          import json
          from huggingface_hub import HfApi
          i = HfApi().model_info("Qwen/Qwen3-TTS-12Hz-1.7B-Base", files_metadata=True)
          print(json.dumps({"repo": i.id, "sha": i.sha, "license": (i.card_data or {}).get("license") if i.card_data else None,
                            "gated": i.gated, "files": [{"name": s.rfilename, "size": s.size, "lfs_sha256": (s.lfs or {}).get("sha256") if isinstance(s.lfs, dict) else getattr(s.lfs, "sha256", None), "blob": s.blob_id} for s in i.siblings]}, indent=1))
          PY
          cat "$RUNNER_TEMP/out/model_info_qwen.json"
      - name: Publish to branch mediaengine-voice-lab (probe/model_info_qwen.json)
        if: always()
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"
          git clone -q --depth 1 --branch mediaengine-voice-lab "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$pub"
          mkdir -p "$pub/probe"; cp "$RUNNER_TEMP"/out/* "$pub/probe/" 2>/dev/null || true
          cd "$pub"; git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine Qwen model info run ${{ github.run_id }}" || true
          for i in 1 2 3; do git push -q origin HEAD:mediaengine-voice-lab && break; git pull -q --rebase origin mediaengine-voice-lab; done
