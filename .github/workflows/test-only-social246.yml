name: test-only-social246
on:
  pull_request:
    paths: ['.ci/test-only/**', '.github/workflows/test-only-*.yml', 'FILE_MANIFEST.json', 'README.txt', 'LOCAL_VALIDATION.json', 'SENSITIVE_DATA_REVIEW.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.3.0
      - run: python -B .ci/test-only/harness/verify_files.py
      - run: python -B .ci/test-only/harness/test_workflow_paths.py
      - run: python -X utf8 -B .ci/test-only/harness/run.py social246
        shell: powershell
