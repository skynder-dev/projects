name: mediaengine-picture-probe
# A research probe for a free local picture maker (MediaEngine; later Merch Forge's designs and cartoon art):
# FLUX.2 [klein] 4B (Black Forest Labs, Apache-2.0) through diffusers on the runner's processor. Does it load in 16 GB,
# how long does a picture take, how does it draw a Forge brief and exact words? Not part of the program; nothing paid.
# Results: branch mediaengine-picture-lab (picture_probe.md, probe.json, the pictures).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/probes/picture_probe.py'
      - '.github/workflows/mediaengine-picture-probe.yml'
permissions:
  contents: write
concurrency:
  group: mediaengine-picture-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  picture:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Room on the disk (the model is about 16 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Packages (torch for the processor, the version the program pins)
        run: |
          python -m pip install --disable-pip-version-check -q torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -q diffusers transformers accelerate safetensors huggingface_hub pillow
          python -m pip freeze | grep -iE "^(torch|diffusers|transformers|accelerate|huggingface)" | tee "$RUNNER_TEMP/versions.txt"
      - name: The model (the repository's commit pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python - "$RUNNER_TEMP/out/model.json" "$RUNNER_TEMP/model" <<'PY'
          import json, sys, urllib.request
          from huggingface_hub import snapshot_download
          repo = "black-forest-labs/FLUX.2-klein-4B"
          with urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}?blobs=true", timeout=60) as r:
              info = json.load(r)
          files = [{"file": s["rfilename"], "size": s.get("size")} for s in info.get("siblings") or []]
          pick = {"repo": repo, "sha": info.get("sha"), "gated": info.get("gated"),
                  "license": (info.get("cardData") or {}).get("license"), "files": files}
          json.dump(pick, open(sys.argv[1], "w"), indent=1)
          print(json.dumps({k: v for k, v in pick.items() if k != "files"}))
          for f in files:
              if (f["size"] or 0) > 50_000_000:
                  print(f["file"], round(f["size"] / 1e9, 2), "GB")
          snapshot_download(repo, revision=info["sha"], local_dir=sys.argv[2],
                            allow_patterns=["model_index.json", "scheduler/*", "text_encoder/*", "tokenizer/*",
                                            "transformer/*", "vae/*"])
          PY
          du -sh "$RUNNER_TEMP/model"; df -h / | tail -1
      - name: The pictures
        run: |
          cp "$RUNNER_TEMP/versions.txt" "$RUNNER_TEMP/out/"
          python .github/probes/picture_probe.py --model "$RUNNER_TEMP/model" --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/picture_probe.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picture
          path: ${{ runner.temp }}/out
  publish:
    needs: picture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/pub
      - name: Publish to branch mediaengine-picture-lab
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
        run: |
          cd "$RUNNER_TEMP/pub"
          printf 'sha=%s\nrun=%s\n' "$SRC_SHA" "$RUN_ID" > RUN.txt
          git init -q; git checkout -q -b mediaengine-picture-lab
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "picture probe $RUN_ID ($SRC_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-picture-lab
