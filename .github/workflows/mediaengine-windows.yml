name: mediaengine-windows
# MediaEngine candidate checks on a real Windows machine (GitHub hosted, not the owner PC):
# compile, app startup self-check, engine R3 == R2 decision regression, engine robustness, full Auto Edit E2E through the app
# routes on synthetic 2- and 7-video folders, page screenshots. No owner media, no secrets, no paid services, no
# network calls from the app under test - except one step that downloads the two public AI models (FAST_LOCAL and
# AI+ PE-Core L/14, pinned commits, SHA-256 checked) from Hugging Face and builds real AI / AI+ reels with them.
on:
  push:
    paths:
      - 'mediaengine/**'
      - '!mediaengine/STATUS.md'             # status / notes are not in the package: no new build for them
      - '!mediaengine/RELEASE_NOTES_*.md'
      - '!mediaengine/tests/pe_core_probe.py'    # model-lab only (mediaengine-model-lab.yml)
      - '!mediaengine/tests/theme_eval.py'
      - '!mediaengine/tests/scale_library_check.py'   # mediaengine-scale.yml
      - '!mediaengine/tests/real_footage_check.py'    # mediaengine-realfootage.yml
      - '!mediaengine/tests/real_footage_manifest.json'
      - '!mediaengine/tests/real_music_check.py'      # mediaengine-realmusic.yml
      - '!mediaengine/tests/real_music_manifest.json'
      - '!mediaengine/tests/beat_probe.py'           # mediaengine-probe.yml (manual)
      - '!mediaengine/tests/drone_theme_check.py'    # mediaengine-drone.yml
      - '!mediaengine/tests/drone_manifest.json'
      - '!mediaengine/tests/voice_lab.py'            # mediaengine-voice-lab.yml
      - '!mediaengine/tests/engine_probe.py'         # mediaengine-engine-probe.yml
      - '!mediaengine/tests/voice_addon_check.py'    # mediaengine-voice-addon.yml
      - '.github/workflows/mediaengine-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaengine-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 190      # a slow runner took 150 min before the large-footage step had finished (run 39050990426)
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned 3.12.42 environment
        shell: pwsh
        run: |
          "OUT=$env:RUNNER_TEMP\me-ci" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:OUT = "$env:RUNNER_TEMP\me-ci"
          python -m pip install --disable-pip-version-check -q -r mediaengine/requirements.txt
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          python --version
      - name: Compile all sources (CPython 3.11)
        shell: pwsh
        run: python -m compileall -q mediaengine/app mediaengine/engine mediaengine/tests
      - name: Public repository - nothing private in MediaEngine's files (owner media, models, secrets, e-mail addresses)
        shell: pwsh
        run: |
          python mediaengine/tests/public_repo_check.py 2>&1 | Tee-Object "$env:OUT\public_repo_check.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Fast helper checks (times, file names, lengths, versions, chosen files)
        shell: pwsh
        run: |
          python mediaengine/tests/unit_checks.py "$env:RUNNER_TEMP\unit" 2>&1 | Tee-Object "$env:OUT\unit_checks.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: In-app update from a server on this PC (found, newest, full installer needed, damaged / unsafe / oversized refused, runtime hard-linked, Russian pages)
        shell: pwsh
        run: |
          python mediaengine/tests/update_check.py "$env:RUNNER_TEMP\updchk" 2>&1 | Tee-Object "$env:OUT\update_check.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The choice of moments on several cores is exactly the accepted choice (random moment sets, the largest 30 s search timed)
        shell: pwsh
        run: |
          python mediaengine/tests/selection_parallel_check.py --cases 400 --big 2>&1 | Tee-Object "$env:OUT\selection_parallel.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: App startup self-check (same check the launcher uses before accepting a release)
        shell: pwsh
        run: |
          $env:ARCHIVIST_HOME = "$env:RUNNER_TEMP\home-selfcheck"
          python -c "import sys; sys.path.insert(0,'mediaengine/app'); import main; from archivist.web import create_app; main.startup_self_check(create_app()); print('startup self-check PASS')" 2>&1 | Tee-Object "$env:OUT\startup_selfcheck.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Make synthetic fixtures
        shell: pwsh
        run: |
          python mediaengine/tests/make_fixtures.py "$env:RUNNER_TEMP\fx" 2>&1 | Tee-Object "$env:OUT\fixtures.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Engine regression R3 == R2 (Windows-proven bytes path)
        shell: pwsh
        run: |
          python mediaengine/tests/engine_regression.py "$env:RUNNER_TEMP\fx\two" "$env:RUNNER_TEMP\reg" 2>&1 | Tee-Object "$env:OUT\engine_regression.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Engine robustness (still video, Private, short footage, damaged cache, presets, phone, HDR, camcorder, wide pixels, 11 other formats)
        shell: pwsh
        run: |
          python mediaengine/tests/engine_robustness.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\rob" 2>&1 | Tee-Object "$env:OUT\engine_robustness.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Audio/video sync at every cut (flash + beep sources)
        shell: pwsh
        run: |
          python mediaengine/tests/av_sync_check.py "$env:RUNNER_TEMP\sync" 2>&1 | Tee-Object "$env:OUT\av_sync.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Auto Edit E2E - phone/camera files (rotated, HEVC .MOV, VFR, no audio, Cyrillic names)
        shell: pwsh
        run: |
          python mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\phone" --home "$env:RUNNER_TEMP\home-phone" --mode technical --skip-cancel --out "$env:OUT\e2e_phone.json" 2>&1 | Tee-Object "$env:OUT\e2e_phone.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: AI-mode glue with a labelled STUB ranking (not an AI quality test)
        shell: pwsh
        run: |
          python mediaengine/tests/semantic_glue_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\semglue" 2>&1 | Tee-Object "$env:OUT\semantic_glue.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: AI+ glue with a stand-in scorer (PE-Core path of the engine, own caches, refused without the model)
        shell: pwsh
        run: |
          python mediaengine/tests/aiplus_glue_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\aiplusglue" 2>&1 | Tee-Object "$env:OUT\aiplus_glue.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Titles and own music (engine + app, Windows fonts, Cyrillic, music loops and fades, editor keeps them)
        shell: pwsh
        run: |
          python mediaengine/tests/dress_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\dress" 2>&1 | Tee-Object "$env:OUT\dress_check.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Full-video Convert (1440p60, rotated phone clip, VFR)
        shell: pwsh
        run: |
          python mediaengine/tests/convert_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\conv" 2>&1 | Tee-Object "$env:OUT\convert_check.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Library - re-analysis keeps compositions and hand-made crops
        shell: pwsh
        run: |
          python mediaengine/tests/library_checks.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\libchk" 2>&1 | Tee-Object "$env:OUT\library_checks.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Library like a user - add a folder, import + analyse, thumbnails, smart clips, Private leaves the Library and is never in a reel
        timeout-minutes: 30
        shell: pwsh
        run: |
          python mediaengine/tests/library_flow_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\libflow" 2>&1 | Tee-Object "$env:OUT\library_flow.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unplugged source drive and no network (app process)
        shell: pwsh
        run: |
          python mediaengine/tests/reliability_checks.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\relchk" 2>&1 | Tee-Object "$env:OUT\reliability_checks.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 64 videos with long names, Windows long-path support OFF (the default on a normal PC)
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $old = (Get-ItemProperty $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          "LongPathsEnabled on the runner: $old -> 0 for this test" | Tee-Object "$env:OUT\scale_paths.txt"
          Set-ItemProperty $key -Name LongPathsEnabled -Value 0
          try {
            python mediaengine/tests/scale_paths_check.py "D:\me-sc" --count 64 2>&1 | Tee-Object -Append "$env:OUT\scale_paths.txt"
            $code = $LASTEXITCODE
          } finally { if ($null -ne $old) { Set-ItemProperty $key -Name LongPathsEnabled -Value $old } }
          if ($code -ne 0) { exit 1 }
      - name: Auto Edit E2E - 7 videos (+ broken + duplicate)
        shell: pwsh
        run: |
          python mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\seven" --home "$env:RUNNER_TEMP\home7" --mode technical --out "$env:OUT\e2e_seven.json" 2>&1 | Tee-Object "$env:OUT\e2e_seven.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Auto Edit E2E - 2 videos (pieces of a reel cut three at once, as on a PC with many cores)
        shell: pwsh
        env:
          MEDENG_RENDER_WORKERS: '3'
        run: |
          python mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\two" --home "$env:RUNNER_TEMP\home2" --mode technical --skip-cancel --files-check --out "$env:OUT\e2e_two.json" 2>&1 | Tee-Object "$env:OUT\e2e_two.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: A reel being made when the app stops without quitting (a PC restart) is made again by itself, once; after Quit it waits for Retry
        shell: pwsh
        run: |
          python mediaengine/tests/restart_resume_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\restart-resume" 2>&1 | Tee-Object "$env:OUT\restart_resume.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Orders from other programs - video by plan, reel from a folder, bad and unsafe orders refused, wait for OK, stop, retry, restart
        shell: pwsh
        run: |
          python mediaengine/tests/orders_check.py --home "$env:RUNNER_TEMP\home-orders" --videos "$env:RUNNER_TEMP\fx\two" --out "$env:OUT\orders.json" 2>&1 | Tee-Object "$env:OUT\orders.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Voice-over add-on without its models - text pieces, word times, captions, the page in both languages, the voice burned onto a video
        shell: pwsh
        run: |
          python mediaengine/tests/voice_check.py --home "$env:RUNNER_TEMP\home-voice" --out "$env:OUT\voice.json" 2>&1 | Tee-Object "$env:OUT\voice.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real AI models from Hugging Face - AI and AI+ test reels, an AI+ reel, its AI variant, blind comparison
        id: models
        timeout-minutes: 75
        continue-on-error: true    # needs huggingface.co: an outage there is reported (results branch) but never blocks the package
        shell: pwsh
        run: |
          python mediaengine/tests/real_models_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\home-ai" --out "$env:OUT\real_models.json" 2>&1 | Tee-Object "$env:OUT\real_models.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Russian interface - every page in Russian, no English left, no page contacts the internet (7-video, library, library-flow and orders homes)
        id: ru
        continue-on-error: true    # a missed word is reported (results branch) but never blocks the package
        shell: pwsh
        run: |
          python mediaengine/tests/i18n_coverage.py "$env:RUNNER_TEMP\home7" "$env:RUNNER_TEMP\libchk\home" "$env:RUNNER_TEMP\home2" "$env:RUNNER_TEMP\libflow\Данные пользователя" "$env:RUNNER_TEMP\home-orders" 2>&1 | Tee-Object "$env:OUT\i18n_coverage.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Every page and button with odd input (typed URLs, damaged forms) - no server error (a copy of the 7-video home)
        id: fuzz
        continue-on-error: true    # reported (results branch); never blocks the package
        timeout-minutes: 15
        shell: pwsh
        run: |
          Copy-Item -Recurse "$env:RUNNER_TEMP\home7" "$env:RUNNER_TEMP\home-fuzz"
          python mediaengine/tests/route_fuzz.py --home "$env:RUNNER_TEMP\home-fuzz" --seconds 540 --out "$env:OUT\route_fuzz.json" 2>&1 | Tee-Object "$env:OUT\route_fuzz.txt"
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\home-fuzz" -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit 1 }
      - name: The app in a real browser (Edge) - form buttons, page scripts, Save MP4, Check this PC in the background
        if: success()
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q playwright==1.47.0
          python mediaengine/tests/browser_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\browser" --channel msedge 2>&1 | Tee-Object "$env:OUT\browser_check.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Screenshots of the real pages in Edge
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $env:ARCHIVIST_HOME = "$env:RUNNER_TEMP\home7"
          $srv = Start-Process python -ArgumentList 'mediaengine/tests/serve.py','8765' -PassThru -WindowStyle Hidden
          for ($i=0; $i -lt 60; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/ping | Out-Null; break } catch { Start-Sleep 1 } }
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          # a project that is still there (the E2E removes the ones it made for its own checks)
          $proj = '/auto'
          try { $m = [regex]::Match((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/auto).Content, "/auto/p/(\d+)"); if ($m.Success) { $proj = '/auto/p/' + $m.Groups[1].Value } } catch {}
          $pages = @{ 'auto_home'='/auto'; 'auto_project'=$proj; 'auto_setup'=('/auto/new?folder=' + [uri]::EscapeDataString("$env:RUNNER_TEMP\fx\seven")) }
          foreach ($k in $pages.Keys) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1600,1500 --virtual-time-budget=4000 "--screenshot=$env:OUT\$k.png" ("http://127.0.0.1:8765" + $pages[$k]) | Out-Null
            Start-Sleep 2
          }
          # the same app in Russian (switch in the top bar), Home with "Check this PC", Settings with the language choice
          try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8765/lang -Headers @{Origin='http://127.0.0.1:8765'} -Body @{lang='ru'; back='/api/ping'} | Out-Null } catch {}
          $ru = @{ 'ru_home'='/'; 'ru_auto_home'='/auto'; 'ru_auto_project'=$proj; 'ru_check'='/auto/check'; 'ru_settings'='/settings' }
          foreach ($k in $ru.Keys) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1600,1300 --virtual-time-budget=4000 "--screenshot=$env:OUT\$k.png" ("http://127.0.0.1:8765" + $ru[$k]) | Out-Null
            Start-Sleep 2
          }
          try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8765/lang -Headers @{Origin='http://127.0.0.1:8765'} -Body @{lang='en'; back='/api/ping'} | Out-Null } catch {}
          Stop-Process -Id $srv.Id -Force
          Get-ChildItem $env:OUT
      - name: Build the installable candidate package
        if: success()
        shell: pwsh
        run: |
          python mediaengine/tools/build_windows_package.py "$env:RUNNER_TEMP\pkg" "$env:OUT" 2>&1 | Tee-Object "$env:OUT\package_build.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package smoke - start like a user, data outside the release, next release sees the projects, quit
        if: success()
        shell: pwsh
        run: |
          # Work on copies: the uploaded package must stay exactly as built (no CI data, logs or shortcuts inside).
          $src = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          $pkg = "$env:RUNNER_TEMP\pkg-test\MediaEngine Тест"      # non-ASCII path on purpose
          $pkg2 = "$env:RUNNER_TEMP\pkg-test2\MediaEngine Тест 2"  # the "next release", extracted somewhere else
          $data = "$env:RUNNER_TEMP\pkg-test\MediaEngine Data"
          foreach ($d in @($pkg, $pkg2)) { New-Item -ItemType Directory -Force (Split-Path $d) | Out-Null; Copy-Item -Recurse $src.FullName $d }
          $log = "$env:OUT\package_smoke.txt"
          "release: $($src.Name)" | Tee-Object $log
          $filesBefore = @(Get-ChildItem -Recurse -File $pkg | ForEach-Object { $_.FullName.Substring($pkg.Length) })
          $desk = [Environment]::GetFolderPath('Desktop')
          $hadArchivistLnk = Test-Path "$desk\Archivist.lnk"
          $H = @{Origin='http://127.0.0.1:8775'}
          function Ping { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8775/api/ping).Content } catch { $null } }
          function WaitUp($sec) { for ($i=0; $i -lt $sec; $i++) { $p = Ping; if ($p) { return $p }; Start-Sleep 1 }; return $null }
          function Ctl($mode) { try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/api/app-control -Headers $H -ContentType 'application/json' -Body ('{"mode":"' + $mode + '","force":true}') | Out-Null } catch {} }
          $fail = @()
          $env:MEDIAENGINE_NO_BROWSER = '1'
          Start-Process wscript.exe -ArgumentList "`"$pkg\Start MediaEngine.vbs`""
          $ping = WaitUp 180
          if (-not $ping) { Get-ChildItem -Recurse $data -ErrorAction SilentlyContinue | Select-Object -First 30 FullName | Tee-Object -Append $log; exit 1 }
          "ping: $ping" | Tee-Object -Append $log
          if (-not $ping.Contains('3.13.0')) { $fail += 'version' }
          $auto = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto
          "auto page: HTTP $($auto.StatusCode), Quit button: $($auto.Content.Contains('quitBtn'))" | Tee-Object -Append $log
          if ($auto.StatusCode -ne 200 -or -not $auto.Content.Contains('quitBtn')) { $fail += 'auto page' }
          Start-Sleep 2
          $st = Get-Content "$data\data\update_status.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          "status: $($st.status) update_check: $($st.update_check)" | Tee-Object -Append $log
          if ($st.status -ne 'running' -or $st.update_check -ne 'updates_off') { $fail += 'update status' }
          "data outside the release: db=$(Test-Path "$data\data\archivist.db") release\data=$(Test-Path "$pkg\data")" | Tee-Object -Append $log
          if (-not (Test-Path "$data\data\archivist.db") -or (Test-Path "$pkg\data")) { $fail += 'data location' }
          $lnk = Test-Path "$desk\MediaEngine RC.lnk"
          "desktop shortcut 'MediaEngine RC': $lnk; stable shortcut touched: $((Test-Path "$desk\Archivist.lnk") -and -not $hadArchivistLnk)" | Tee-Object -Append $log
          if (-not $lnk -or ((Test-Path "$desk\Archivist.lnk") -and -not $hadArchivistLnk)) { $fail += 'shortcut' }
          # the shortcut must point at THIS folder, Cyrillic name included (read through the Unicode shell interface)
          $readLnk = "import sys, json, importlib.util as u; s = u.spec_from_file_location('pa', sys.argv[2]); m = u.module_from_spec(s); s.loader.exec_module(m); print(json.dumps(m.read_shell_link(sys.argv[1])))"
          $sc = (& "$pkg\.venv\Scripts\python.exe" -B -s -E -c $readLnk "$desk\MediaEngine RC.lnk" "$pkg\app\archivist\platform_adapter.py") | ConvertFrom-Json
          $want = "`"$pkg\Start MediaEngine.vbs`""
          "desktop shortcut runs: $($sc.target) $($sc.arguments) (expected $want)" | Tee-Object -Append $log
          if ($sc.arguments -ne $want) { $fail += 'shortcut target' }
          if ((Test-Path "$pkg\Archivist.vbs") -or (Test-Path "$pkg\launcher")) { $fail += 'stable launcher files created' }
          # a project made in this release
          $folder = "$env:RUNNER_TEMP\fx\two"
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/auto/create -Headers $H -Body @{folder=$folder; length='5'; format='social_hd'; sound='auto'; mode='technical'}
            $made = $r.StatusCode -eq 200 -and $r.Content.Contains('/auto/p/1/')
          } catch { $made = $false; "create project error: $_" | Tee-Object -Append $log }
          "create project: $made" | Tee-Object -Append $log
          if (-not $made) { $fail += 'create project' }
          # second copy of the app on the same port must refuse to start (no second set of workers)
          $env:ARCHIVIST_V2_CHILD = '1'
          $p2 = Start-Process "$pkg\.venv\Scripts\python.exe" -ArgumentList '-B','-s','-E',"`"$pkg\app\main.py`"",'--no-browser' -PassThru -RedirectStandardError "$env:OUT\second_copy_stderr.txt" -WindowStyle Hidden
          $exited = $p2.WaitForExit(90000)
          $err2 = Get-Content "$env:OUT\second_copy_stderr.txt" -Raw -ErrorAction SilentlyContinue
          "second copy exited: $exited code: $($p2.ExitCode) message: $($err2 -replace '\s+',' ')" | Tee-Object -Append $log
          if (-not $exited -or $p2.ExitCode -eq 0 -or -not (Ping)) { $fail += 'second copy' }
          Remove-Item Env:ARCHIVIST_V2_CHILD
          # restart through the app (same path as the Restart button)
          Ctl 'restart'; Start-Sleep 3
          $again = WaitUp 120
          "restart: $([bool]$again)" | Tee-Object -Append $log
          if (-not $again) { $fail += 'restart' }
          Ctl 'stop'; Start-Sleep 4
          "stopped: $(-not (Ping))" | Tee-Object -Append $log
          if (Ping) { $fail += 'quit' }
          # the next release, extracted elsewhere, started while this one still runs: it offers to switch (answered
          # "yes" here), stops this one and starts itself; then it opens the same projects
          Start-Process wscript.exe -ArgumentList "`"$pkg\Start MediaEngine.vbs`""
          if (-not (WaitUp 180)) { $fail += 'start again' }
          $env:MEDIAENGINE_SWITCH_ANSWER = 'yes'
          Start-Process wscript.exe -ArgumentList "`"$pkg2\Start MediaEngine.vbs`""
          $switched = $false
          for ($i = 0; $i -lt 180 -and -not $switched; $i++) {
            try { $pj = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8775/api/ping).Content | ConvertFrom-Json; $switched = ($pj.install -eq $pkg2) } catch {}
            if (-not $switched) { Start-Sleep 1 }
          }
          Remove-Item Env:MEDIAENGINE_SWITCH_ANSWER
          "switched from the running release to the next one: $switched" | Tee-Object -Append $log
          if (-not $switched) {
            $fail += 'switch to next release'
            python mediaengine/tests/ci_state.py "$data" 2>&1 | Tee-Object -Append $log
            Get-Content "$data\data\logs\launcher.log" -Tail 20 -ErrorAction SilentlyContinue | Tee-Object -Append $log
            try { "ping now: $((Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8775/api/ping).Content)" | Tee-Object -Append $log } catch { "ping now: none" | Tee-Object -Append $log }
          }
          # the first release ran three times; its folder must hold exactly the files it was unpacked with
          $known = [System.Collections.Generic.HashSet[string]]::new([string[]]$filesBefore, [System.StringComparer]::OrdinalIgnoreCase)
          $added = @(Get-ChildItem -Recurse -File $pkg | ForEach-Object { $_.FullName.Substring($pkg.Length) } | Where-Object { -not $known.Contains($_) })
          "files added to the release folder by running it: $($added.Count) $(($added | Select-Object -First 10) -join ' ; ')" | Tee-Object -Append $log
          if ($added.Count) { $fail += 'release folder written' }
          if (-not (WaitUp 180)) { $fail += 'next release start' } else {
            $home2 = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto).Content
            $seen = $home2.Contains("/auto/p/1")
            "next release sees the project: $seen; its own data folder created: $(Test-Path "$env:RUNNER_TEMP\pkg-test2\MediaEngine Data")" | Tee-Object -Append $log
            if (-not $seen -or (Test-Path "$env:RUNNER_TEMP\pkg-test2\MediaEngine Data")) { $fail += 'next release data' }
            Ctl 'stop'; Start-Sleep 4
          }
          Remove-Item "$desk\MediaEngine RC.lnk" -ErrorAction SilentlyContinue
          if ($fail.Count) { "FAILED: $($fail -join ', ')" | Tee-Object -Append $log; exit 1 }
          "package smoke PASS" | Tee-Object -Append $log
      - name: Update button in the package - a next build served from this PC is found, installed next to this one (runtime hard-linked) and takes over
        if: success()
        shell: pwsh
        run: |
          # Work on a copy: the uploaded package must stay exactly as built.
          $src = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          $log = "$env:OUT\update_smoke.txt"
          $base = "$env:RUNNER_TEMP\upd\Программы"          # non-ASCII on purpose
          $cur = Join-Path $base $src.Name
          New-Item -ItemType Directory -Force $base | Out-Null
          Copy-Item -Recurse $src.FullName $cur
          $mm = [regex]::Match($src.Name, '^(MediaEngine-.+-b)(\d+)$')
          $nextName = $mm.Groups[1].Value + ([int]$mm.Groups[2].Value + 100000)
          $want = Join-Path $base $nextName
          $srv = "$env:RUNNER_TEMP\upd-srv"; New-Item -ItemType Directory -Force $srv | Out-Null
          python mediaengine/tools/make_update_bundle.py $src.FullName $srv --name $nextName --run-url "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" 2>&1 | Tee-Object $log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $http = Start-Process python -ArgumentList '-m', 'http.server', '18790', '--bind', '127.0.0.1', '--directory', "`"$srv`"" -PassThru -WindowStyle Hidden
          $fail = @()
          $H = @{Origin='http://127.0.0.1:8775'}
          function Ping { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8775/api/ping).Content | ConvertFrom-Json } catch { $null } }
          function Post($path) { try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://127.0.0.1:8775$path" -Headers $H -MaximumRedirection 0 -ErrorAction SilentlyContinue | Out-Null } catch {} }
          function Text($path) { try { ((Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8775$path").Content -replace '<script[\s\S]*?</script>', ' ' -replace '<[^>]+>', ' ' -replace '\s+', ' ') } catch { "$_" } }
          $env:MEDIAENGINE_NO_BROWSER = '1'
          $env:MEDIAENGINE_DATA = "$env:RUNNER_TEMP\upd\Data"
          $env:MEDIAENGINE_UPDATE_URL = 'http://127.0.0.1:18790/'
          try {
            Start-Process wscript.exe -ArgumentList "`"$cur\Start MediaEngine.vbs`""
            $p = $null; for ($i = 0; $i -lt 180 -and -not $p; $i++) { $p = Ping; if (-not $p) { Start-Sleep 1 } }
            "started: $($p.install) $($p.build)" | Tee-Object -Append $log
            if (-not $p) { $fail += 'start' } else {
              $auto = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto).Content
              "Update button in the top bar: $($auto.Contains("action='/auto/update/check'"))" | Tee-Object -Append $log
              if (-not $auto.Contains("action='/auto/update/check'")) { $fail += 'Update button' }
              Post '/auto/update/check'
              $pg = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto/update).Content
              $found = $pg.Contains("action='/auto/update/apply'")
              "next build found: $found" | Tee-Object -Append $log
              if (-not $found) { $fail += 'update found'; (Text '/auto/update') | Tee-Object -Append $log }
              Post '/auto/update/apply'
              $sw = $null
              for ($i = 0; $i -lt 300 -and -not $sw; $i++) { $q = Ping; if ($q -and $q.install -eq $want) { $sw = $q } else { Start-Sleep 1 } }
              "switched to the new build: $([bool]$sw) $($sw.install) $($sw.build)" | Tee-Object -Append $log
              if (-not $sw) {
                $fail += 'switch to the new build'
                try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/api/update-status).Content | Tee-Object -Append $log } catch {}
                Get-Content "$env:MEDIAENGINE_DATA\data\logs\launcher.log" -Tail 20 -ErrorAction SilentlyContinue | Tee-Object -Append $log
              } else {
                $links = @(fsutil hardlink list "$want\.venv\Scripts\python.exe").Count
                "names of the runtime's python.exe (hard links, the old and the new build): $links" | Tee-Object -Append $log
                if ($links -lt 2) { $fail += 'runtime hard-linked' }
                $code = try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto).StatusCode } catch { 0 }
                "new build pages: $code; old build kept: $(Test-Path "$cur\Start MediaEngine.vbs"); nothing half-made: $(-not (Test-Path "$base\.update-*"))" | Tee-Object -Append $log
                if ($code -ne 200 -or -not (Test-Path "$cur\Start MediaEngine.vbs") -or (Test-Path "$base\.update-*")) { $fail += 'after the update' }
                # the old build is listed for going back (Check this PC)
                $chk = (Invoke-WebRequest -UseBasicParsing -Headers @{'Sec-Fetch-Site'='same-origin'} http://127.0.0.1:8775/auto/check).Content
                if (-not $chk.Contains($src.Name)) { $fail += 'old build listed on Check this PC' }
              }
            }
          } finally {
            try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/api/app-control -Headers $H -ContentType 'application/json' -Body '{"mode":"stop","force":true}' | Out-Null } catch {}
            for ($i = 0; $i -lt 30 -and (Ping); $i++) { Start-Sleep 1 }
            Stop-Process -Id $http.Id -ErrorAction SilentlyContinue
            Remove-Item Env:MEDIAENGINE_NO_BROWSER, Env:MEDIAENGINE_DATA, Env:MEDIAENGINE_UPDATE_URL -ErrorAction SilentlyContinue
            Remove-Item "$([Environment]::GetFolderPath('Desktop'))\MediaEngine RC.lnk" -ErrorAction SilentlyContinue
          }
          if ($fail.Count) { "FAILED: $($fail -join ', ')" | Tee-Object -Append $log; exit 1 }
          "update button smoke PASS" | Tee-Object -Append $log
      - name: Package runtime runs the engine end to end, with the packaged Python blocked from the internet
        if: success()
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\pkg-test\MediaEngine Тест"
          $py = "$pkg\.venv\Scripts\python.exe"; $pyw = "$pkg\.venv\Scripts\pythonw.exe"
          $profiles = Get-NetFirewallProfile | Select-Object Name, Enabled
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName 'MediaEngine CI offline' -Direction Outbound -Program $py -Action Block | Out-Null
          New-NetFirewallRule -DisplayName 'MediaEngine CI offline w' -Direction Outbound -Program $pyw -Action Block | Out-Null
          try {
            & $py -s -E -c "import urllib.request; urllib.request.urlopen('https://www.microsoft.com', timeout=10)" 2>$null
            $blocked = ($LASTEXITCODE -ne 0)
            "internet blocked for the packaged Python: $blocked" | Tee-Object "$env:OUT\offline.txt"
            # the choice of moments on two worker processes even for the small fixture search: the pool must start in
            # the packaged Python (spawn, -s -E, the job object)
            $env:MEDENG_SELECT_MIN_PARALLEL = '0'; $env:MEDENG_SELECT_WORKERS = '2'
            & $py -s -E -X utf8 mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\seven" --home "$env:RUNNER_TEMP\home-pkg" --mode technical --length 15 --skip-cancel --out "$env:OUT\e2e_packaged_python.json" 2>&1 | Tee-Object "$env:OUT\e2e_packaged_python.txt"
            $code = $LASTEXITCODE
            if ($code -eq 0) {   # orders with the packaged Python and FFmpeg too (folders renamed on NTFS, offline)
              & $py -s -E -X utf8 mediaengine/tests/orders_check.py --home "$env:RUNNER_TEMP\home-pkg-orders" --videos "$env:RUNNER_TEMP\fx\two" --out "$env:OUT\orders_packaged_python.json" 2>&1 | Tee-Object "$env:OUT\orders_packaged_python.txt"
              $code = $LASTEXITCODE
            }
          } finally {
            Remove-NetFirewallRule -DisplayName 'MediaEngine CI offline' -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName 'MediaEngine CI offline w' -ErrorAction SilentlyContinue
            foreach ($p in $profiles) { Set-NetFirewallProfile -Profile $p.Name -Enabled $p.Enabled }
          }
          if (-not $blocked) { "WARNING: the firewall did not block; the offline claim is NOT proven by this run" | Tee-Object -Append "$env:OUT\offline.txt" }
          if ($code -ne 0) { exit 1 }
      - name: Package is unchanged by the checks
        if: success()
        shell: pwsh
        run: |
          $src = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          $extra = @('data','launcher','Archivist.vbs','MediaArchive','Exports','Staging','Private','Rejected','config.json') | Where-Object { Test-Path (Join-Path $src.FullName $_) }
          if ($extra) { "created by running: $($extra -join ', ')"; exit 1 }
          "pristine" | Tee-Object "$env:OUT\package_pristine.txt"
      - name: Build the installer (Inno Setup, per-user, no administrator rights)
        if: success()
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { "Inno Setup is not available on this runner"; exit 1 }
          $src = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\setup" | Out-Null
          & $iscc /Q "/DPkgName=$env:PKG_NAME" "/DAppVer=$env:PKG_VERSION" "/DSrcDir=$($src.FullName)" "/DOutDir=$env:RUNNER_TEMP\setup" mediaengine\tools\mediaengine_setup.iss 2>&1 | Tee-Object "$env:OUT\setup_build.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP\setup" | ForEach-Object { "$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" } | Tee-Object -Append "$env:OUT\setup_build.txt"
      - name: Installer smoke - silent install into a Cyrillic folder, start from the Start-menu shortcut, Quit from the tray icon, uninstall keeps the data
        if: success()
        shell: pwsh
        run: |
          $log = "$env:OUT\setup_smoke.txt"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\setup\*-Setup.exe" | Select-Object -First 1
          $base = "$env:RUNNER_TEMP\inst\Мои программы\MediaEngine"
          $rel = Join-Path $base $env:PKG_NAME
          $data = Join-Path $base 'MediaEngine Data'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'MediaEngine.lnk'
          # a first-time user: no remembered data folder (the package smoke left one; put it back afterwards)
          $ptr = "$env:LOCALAPPDATA\MediaEngine\data_root.txt"
          if (Test-Path $ptr) { Move-Item $ptr "$ptr.ci-bak" -Force }
          $fail = @()
          function Ping { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8775/api/ping).Content } catch { $null } }
          try {
            $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LANG=ru',"/DIR=`"$base`"","/LOG=`"$env:OUT\setup_install.log`"" -PassThru -Wait
            $installedAt = Get-Date
            "setup: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB; exit code $($p.ExitCode)" | Tee-Object $log
            "build folder: $(Test-Path "$rel\Start MediaEngine.vbs"); Start-menu shortcut: $(Test-Path $lnk); uninstaller: $(Test-Path "$base\unins000.exe")" | Tee-Object -Append $log
            if ($p.ExitCode -ne 0 -or -not (Test-Path "$rel\Start MediaEngine.vbs") -or -not (Test-Path $lnk) -or -not (Test-Path "$base\unins000.exe")) { $fail += 'install' }
            # start exactly as the Start-menu shortcut does (read through the Unicode shell interface: the WScript
            # object would turn the Cyrillic folder into "???")
            $readLnk = "import sys, json, importlib.util as u; s = u.spec_from_file_location('pa', sys.argv[2]); m = u.module_from_spec(s); s.loader.exec_module(m); print(json.dumps(m.read_shell_link(sys.argv[1])))"
            $pa = "$env:GITHUB_WORKSPACE\mediaengine\app\archivist\platform_adapter.py"
            $sc = (& python -c $readLnk $lnk $pa) | ConvertFrom-Json
            "Start-menu shortcut: $($sc.target) $($sc.arguments) in $($sc.workdir)" | Tee-Object -Append $log
            if ($sc.arguments -ne "`"$rel\Start MediaEngine.vbs`"") { $fail += 'start-menu shortcut target' }
            $env:MEDIAENGINE_NO_BROWSER = '1'
            Start-Process $sc.target -ArgumentList $sc.arguments -WorkingDirectory $sc.workdir
            $up = $null; for ($i = 0; $i -lt 180 -and -not $up; $i++) { $up = Ping; if (-not $up) { Start-Sleep 1 } }
            "started from the shortcut: $([bool]$up) $up" | Tee-Object -Append $log
            if (-not $up) { $fail += 'start' }
            $auto = try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto).StatusCode } catch { 0 }
            # Setup was run in Russian: the program starts in Russian (until switched in the program)
            $home_ru = try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/).Content } catch { '' }
            "first start in the Setup language (Russian): $($home_ru.Contains('Проверка компьютера'))" | Tee-Object -Append $log
            if (-not $home_ru.Contains('Проверка компьютера')) { $fail += 'setup language' }
            "auto page: $auto; data next to the build: $(Test-Path "$data\data\archivist.db"); build folder untouched: $(-not (Test-Path "$rel\data"))" | Tee-Object -Append $log
            if ($auto -ne 200 -or -not (Test-Path "$data\data\archivist.db") -or (Test-Path "$rel\data")) { $fail += 'first start' }
            # after the first start the Start-menu entry still points at this build (the app re-saves it)
            $sc2 = (& python -c $readLnk $lnk $pa) | ConvertFrom-Json
            if ($sc2.arguments -ne "`"$rel\Start MediaEngine.vbs`"") { $fail += 'start-menu shortcut after start' }
            # start at sign-in (Settings, off by default): on -> a Startup shortcut runs this build's launcher without a window
            $asl = Join-Path ([Environment]::GetFolderPath('Startup')) 'MediaEngine.lnk'
            $asBefore = Test-Path $asl
            try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/settings/save -Headers @{Origin='http://127.0.0.1:8775'} -Body @{autostart_shown='1'; autostart='on'; notify='on'} -MaximumRedirection 0 -ErrorAction SilentlyContinue | Out-Null } catch {}
            $as = if (Test-Path $asl) { (& python -c $readLnk $asl $pa) | ConvertFrom-Json } else { $null }
            "start at sign-in: off before: $(-not $asBefore); on: $([bool]$as) $($as.target) $($as.arguments)" | Tee-Object -Append $log
            if ($asBefore -or -not $as -or -not $as.target.EndsWith('pythonw.exe') -or -not $as.arguments.Contains('--no-browser') -or -not $as.arguments.Contains($rel)) { $fail += 'start at sign-in' }
            # uninstall while MediaEngine runs: refused (silent mode answers Cancel), nothing removed
            if ($up) {
              $u = Start-Process "$base\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
              Start-Sleep 5
              "uninstall while running: exit $($u.ExitCode); build kept: $(Test-Path "$rel\Start MediaEngine.vbs")" | Tee-Object -Append $log
              if (-not (Test-Path "$rel\Start MediaEngine.vbs")) { $fail += 'uninstall did not wait for Quit' }
            }
            # Quit from the tray icon, as a user does: its menu command "Quit" sent to the icon's window
            if ($up) {
              $trayState = try { ((Ping) | ConvertFrom-Json).tray } catch { '' }
              Add-Type -Namespace MeCi -Name U -MemberDefinition '[DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t); [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint m, IntPtr w, IntPtr l);'
              $tw = [MeCi.U]::FindWindowW('MediaEngineTray', [NullString]::Value)   # ($null would be passed as "": no window has an empty title)
              if ($tw -ne [IntPtr]::Zero) { [void][MeCi.U]::PostMessageW($tw, 0x0111, [IntPtr]1002, [IntPtr]::Zero) }
              for ($i = 0; $i -lt 30 -and (Ping); $i++) { Start-Sleep 1 }
              $trayQuit = -not (Ping)
              "tray icon: $trayState; its window found: $($tw -ne [IntPtr]::Zero); Quit from the tray stopped MediaEngine: $trayQuit" | Tee-Object -Append $log
              if ($trayState -notin @('shown', 'no_taskbar') -or $tw -eq [IntPtr]::Zero -or -not $trayQuit) { $fail += 'tray icon Quit' }
            }
            if (Ping) { try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/api/app-control -Headers @{Origin='http://127.0.0.1:8775'} -ContentType 'application/json' -Body '{"mode":"stop","force":true}' | Out-Null } catch {} }
            for ($i = 0; $i -lt 30 -and (Ping); $i++) { Start-Sleep 1 }
            # Quit = the server stops answering; its processes may need a few more seconds to exit
            for ($i = 0; $i -lt 30 -and (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($rel) }); $i++) { Start-Sleep 1 }
            $left = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($rel) } | ForEach-Object { "$($_.Name) $($_.Id)" })
            "processes of the build still running after Quit: $($left -join ', ')" | Tee-Object -Append $log
            $newFiles = @(Get-ChildItem -Recurse -File $rel | Where-Object { $_.LastWriteTime -gt $installedAt } | Select-Object -First 15 | ForEach-Object { $_.FullName.Substring($rel.Length) })
            "files written into the build folder while it ran: $($newFiles.Count) $($newFiles -join ' ; ')" | Tee-Object -Append $log
            if ($newFiles.Count) { $fail += 'build folder written while running' }
            if (Test-Path "$base\unins000.exe") { Start-Process "$base\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait }
            for ($i = 0; $i -lt 90 -and ((Test-Path $rel) -or (Test-Path "$base\unins000.exe")); $i++) { Start-Sleep 1 }   # finishes in a copy of itself
            "after Quit + uninstall: build removed: $(-not (Test-Path $rel)); shortcut removed: $(-not (Test-Path $lnk)); data kept: $(Test-Path "$data\data\archivist.db")" | Tee-Object -Append $log
            if (Test-Path $rel) { "left in the build folder: $(@(Get-ChildItem -Recurse $rel | Select-Object -First 15 | ForEach-Object { $_.FullName.Substring($rel.Length) }) -join ' ; ')" | Tee-Object -Append $log }
            if ((Test-Path $rel) -or (Test-Path $lnk) -or -not (Test-Path "$data\data\archivist.db")) { $fail += 'uninstall' }
            "uninstall removed the start-at-sign-in shortcut: $(-not (Test-Path $asl))" | Tee-Object -Append $log
            if (Test-Path $asl) { $fail += 'uninstall start at sign-in' }
          } finally {
            Remove-Item Env:MEDIAENGINE_NO_BROWSER -ErrorAction SilentlyContinue
            Remove-Item $ptr -ErrorAction SilentlyContinue
            if (Test-Path "$ptr.ci-bak") { Move-Item "$ptr.ci-bak" $ptr -Force }
            Remove-Item "$([Environment]::GetFolderPath('Desktop'))\MediaEngine RC.lnk" -ErrorAction SilentlyContinue
            Remove-Item (Join-Path ([Environment]::GetFolderPath('Startup')) 'MediaEngine.lnk') -ErrorAction SilentlyContinue
          }
          if ($fail.Count) { "FAILED: $($fail -join ', ')" | Tee-Object -Append $log; exit 1 }
          "installer smoke PASS" | Tee-Object -Append $log
      - name: Upload installable package (one ZIP named like the release folder inside it)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ runner.temp }}/pkg/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload installer (Setup.exe, per-user, keeps data on uninstall)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-Setup
          path: ${{ runner.temp }}/setup/
          compression-level: 0
      - name: Large phone-like footage (4K H.264, 4K HEVC, 5 min 1080p) - build time measured, technical and AI (real model, shared cache)
        id: large
        if: success()
        continue-on-error: true
        timeout-minutes: 80
        shell: pwsh
        run: |
          python mediaengine/tests/heavy_media_check.py "D:\me-heavy" "--ai-models=$env:RUNNER_TEMP\home-ai\models" 2>&1 | Tee-Object "$env:OUT\heavy_media.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaengine-windows-ci
          path: ${{ runner.temp }}/me-ci/*
          if-no-files-found: warn
      - name: Publish the in-app update (branch mediaengine-update, read by the Update button) - only a fully green run of main
        id: publish
        # every check passed, also those that never block the package (models, Russian pages, odd input, large footage)
        if: success() && github.ref == 'refs/heads/main' && steps.models.outcome == 'success' && steps.ru.outcome == 'success' && steps.fuzz.outcome == 'success' && steps.large.outcome == 'success'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -e
          pkg=$(ls -d "$RUNNER_TEMP"/pkg/MediaEngine-*/ | head -1)
          pub="$RUNNER_TEMP/me-update-pub"; rm -rf "$pub"; mkdir -p "$pub"
          python mediaengine/tools/make_update_bundle.py "$pkg" "$pub" --run-url "https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          printf '# MediaEngine in-app update\n\nRead by the Update button of MediaEngine (app/archivist/updater.py). Made by Windows CI run %s from %s.\n' "$RUN_ID" "$SRC_SHA" > "$pub/README.md"
          # the previous ZIP stays one more round: a latest.json a cache still hands out must not point at nothing
          prev="$RUNNER_TEMP/me-update-prev"; rm -rf "$prev"
          if git clone -q --depth 1 --branch mediaengine-update "https://github.com/${{ github.repository }}.git" "$prev" 2>/dev/null; then
            pf=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['file'])" "$prev/latest.json" 2>/dev/null || true)
            if [ -n "$pf" ] && [ -f "$prev/$pf" ] && [ ! -f "$pub/$pf" ]; then cp "$prev/$pf" "$pub/"; fi
          fi
          cd "$pub"; git init -q; git checkout -q -b mediaengine-update
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine update from run $RUN_ID ($SRC_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-update
      - name: The published update is served where the Update button reads it (raw.githubusercontent.com, same bytes)
        if: steps.publish.outcome == 'success'
        continue-on-error: true    # GitHub's cache can take minutes: reported, never blocks
        shell: pwsh
        run: |
          $log = "$env:OUT\update_served.txt"
          $want = (Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1).Name
          $base = 'https://raw.githubusercontent.com/${{ github.repository }}/mediaengine-update/'
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            try {
              $m = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 20 -Headers @{'Cache-Control'='no-cache'} ($base + "latest.json?t=$i$(Get-Random)")).Content | ConvertFrom-Json
              if ($m.pkg -eq $want) {
                $zip = "$env:RUNNER_TEMP\served-update.zip"
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 ($base + $m.file + "?sha=" + $m.sha256.Substring(0, 16)) -OutFile $zip
                $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
                "served: $($m.pkg) $($m.file) $((Get-Item $zip).Length) bytes, SHA-256 matches: $($sha -eq $m.sha256)" | Tee-Object $log
                $ok = ($sha -eq $m.sha256) -and ((Get-Item $zip).Length -eq $m.size)
              } else { "try $i - still the previous build: $($m.pkg)" | Tee-Object -Append $log }
            } catch { "try $i - $_" | Tee-Object -Append $log }
            if (-not $ok) { Start-Sleep 15 }
          }
          if (-not $ok) { "NOT served yet" | Tee-Object -Append $log; exit 1 }
          "update served PASS" | Tee-Object -Append $log
      - name: Publish results to branch mediaengine-ci-results
        if: success() || failure()
        shell: bash
        env:
          SRC_REF: ${{ github.ref_name }}
          SRC_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          out="$RUNNER_TEMP/me-ci"; pub="$RUNNER_TEMP/me-ci-pub"
          rm -rf "$pub"; mkdir -p "$pub/latest"
          cp "$out"/* "$pub/latest/" 2>/dev/null || true
          printf 'ref=%s\nsha=%s\nrun=%s\nstatus=%s\n' "$SRC_REF" "$SRC_SHA" "$RUN_ID" "$JOB_STATUS" > "$pub/latest/RUN.txt"
          cd "$pub"; git init -q; git checkout -q -b mediaengine-ci-results
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine windows ci run $RUN_ID ($SRC_REF $SRC_SHA) $JOB_STATUS"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-ci-results
