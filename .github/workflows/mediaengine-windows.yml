name: mediaengine-windows
# MediaEngine candidate checks on a real Windows machine (GitHub hosted, not the owner PC):
# compile, app startup self-check, engine R3 == R2 decision regression, engine robustness, full Auto Edit E2E through the app
# routes on synthetic 2- and 7-video folders, page screenshots. No owner media, no secrets, no network calls
# from the app under test, no paid services. The FAST_LOCAL model is not in git, so CI covers the
# labelled Technical mode; semantic=required is checked on the owner PC.
on:
  push:
    paths:
      - 'mediaengine/**'
      - '.github/workflows/mediaengine-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaengine-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned 3.12.42 environment
        shell: pwsh
        run: |
          "OUT=$env:RUNNER_TEMP\me-ci" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:OUT = "$env:RUNNER_TEMP\me-ci"
          python -m pip install --disable-pip-version-check -q -r mediaengine/requirements.txt
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          python --version
      - name: Compile all sources (CPython 3.11)
        shell: pwsh
        run: python -m compileall -q mediaengine/app mediaengine/engine mediaengine/tests
      - name: Fast helper checks (times, file names, lengths, versions, chosen files)
        shell: pwsh
        run: |
          python mediaengine/tests/unit_checks.py "$env:RUNNER_TEMP\unit" 2>&1 | Tee-Object "$env:OUT\unit_checks.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: App startup self-check (same check the launcher uses before accepting a release)
        shell: pwsh
        run: |
          $env:ARCHIVIST_HOME = "$env:RUNNER_TEMP\home-selfcheck"
          python -c "import sys; sys.path.insert(0,'mediaengine/app'); import main; from archivist.web import create_app; main.startup_self_check(create_app()); print('startup self-check PASS')" 2>&1 | Tee-Object "$env:OUT\startup_selfcheck.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Make synthetic fixtures
        shell: pwsh
        run: python mediaengine/tests/make_fixtures.py "$env:RUNNER_TEMP\fx"
      - name: Engine regression R3 == R2 (Windows-proven bytes path)
        shell: pwsh
        run: |
          python mediaengine/tests/engine_regression.py "$env:RUNNER_TEMP\fx\two" "$env:RUNNER_TEMP\reg" 2>&1 | Tee-Object "$env:OUT\engine_regression.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Engine robustness (still video, Private file, short footage, damaged cache, presets)
        shell: pwsh
        run: |
          python mediaengine/tests/engine_robustness.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\rob" 2>&1 | Tee-Object "$env:OUT\engine_robustness.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Audio/video sync at every cut (flash + beep sources)
        shell: pwsh
        run: |
          python mediaengine/tests/av_sync_check.py "$env:RUNNER_TEMP\sync" 2>&1 | Tee-Object "$env:OUT\av_sync.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Auto Edit E2E - phone/camera files (rotated, HEVC .MOV, VFR, no audio, Cyrillic names)
        shell: pwsh
        run: |
          python mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\phone" --home "$env:RUNNER_TEMP\home-phone" --mode technical --skip-cancel --out "$env:OUT\e2e_phone.json" 2>&1 | Tee-Object "$env:OUT\e2e_phone.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: AI-mode glue with a labelled STUB ranking (not an AI quality test)
        shell: pwsh
        run: |
          python mediaengine/tests/semantic_glue_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\semglue" 2>&1 | Tee-Object "$env:OUT\semantic_glue.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Full-video Convert (1440p60, rotated phone clip, VFR)
        shell: pwsh
        run: |
          python mediaengine/tests/convert_check.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\conv" 2>&1 | Tee-Object "$env:OUT\convert_check.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Library - re-analysis keeps compositions and hand-made crops
        shell: pwsh
        run: |
          python mediaengine/tests/library_checks.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\libchk" 2>&1 | Tee-Object "$env:OUT\library_checks.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unplugged source drive and no network (app process)
        shell: pwsh
        run: |
          python mediaengine/tests/reliability_checks.py "$env:RUNNER_TEMP\fx" "$env:RUNNER_TEMP\relchk" 2>&1 | Tee-Object "$env:OUT\reliability_checks.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 64 videos with long names, Windows long-path support OFF (the default on a normal PC)
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $old = (Get-ItemProperty $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          "LongPathsEnabled on the runner: $old -> 0 for this test" | Tee-Object "$env:OUT\scale_paths.txt"
          Set-ItemProperty $key -Name LongPathsEnabled -Value 0
          try {
            python mediaengine/tests/scale_paths_check.py "D:\me-sc" --count 64 2>&1 | Tee-Object -Append "$env:OUT\scale_paths.txt"
            $code = $LASTEXITCODE
          } finally { if ($null -ne $old) { Set-ItemProperty $key -Name LongPathsEnabled -Value $old } }
          if ($code -ne 0) { exit 1 }
      - name: Auto Edit E2E - 7 videos (+ broken + duplicate)
        shell: pwsh
        run: |
          python mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\seven" --home "$env:RUNNER_TEMP\home7" --mode technical --out "$env:OUT\e2e_seven.json" 2>&1 | Tee-Object "$env:OUT\e2e_seven.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Auto Edit E2E - 2 videos
        shell: pwsh
        run: |
          python mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\two" --home "$env:RUNNER_TEMP\home2" --mode technical --skip-cancel --files-check --out "$env:OUT\e2e_two.json" 2>&1 | Tee-Object "$env:OUT\e2e_two.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Screenshots of the real pages in Edge
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $env:ARCHIVIST_HOME = "$env:RUNNER_TEMP\home7"
          $srv = Start-Process python -ArgumentList 'mediaengine/tests/serve.py','8765' -PassThru -WindowStyle Hidden
          for ($i=0; $i -lt 60; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/ping | Out-Null; break } catch { Start-Sleep 1 } }
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          $pages = @{ 'auto_home'='/auto'; 'auto_project'='/auto/p/1'; 'auto_setup'=('/auto/new?folder=' + [uri]::EscapeDataString("$env:RUNNER_TEMP\fx\seven")) }
          foreach ($k in $pages.Keys) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1600,1500 --virtual-time-budget=4000 "--screenshot=$env:OUT\$k.png" ("http://127.0.0.1:8765" + $pages[$k]) | Out-Null
            Start-Sleep 2
          }
          Stop-Process -Id $srv.Id -Force
          Get-ChildItem $env:OUT
      - name: Build the installable candidate package
        if: success()
        shell: pwsh
        run: |
          python mediaengine/tools/build_windows_package.py "$env:RUNNER_TEMP\pkg" "$env:OUT" 2>&1 | Tee-Object "$env:OUT\package_build.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package smoke - start like a user, data outside the release, next release sees the projects, quit
        if: success()
        shell: pwsh
        run: |
          # Work on copies: the uploaded package must stay exactly as built (no CI data, logs or shortcuts inside).
          $src = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          $pkg = "$env:RUNNER_TEMP\pkg-test\MediaEngine Тест"      # non-ASCII path on purpose
          $pkg2 = "$env:RUNNER_TEMP\pkg-test2\MediaEngine Тест 2"  # the "next release", extracted somewhere else
          $data = "$env:RUNNER_TEMP\pkg-test\MediaEngine Data"
          foreach ($d in @($pkg, $pkg2)) { New-Item -ItemType Directory -Force (Split-Path $d) | Out-Null; Copy-Item -Recurse $src.FullName $d }
          $log = "$env:OUT\package_smoke.txt"
          "release: $($src.Name)" | Tee-Object $log
          $desk = [Environment]::GetFolderPath('Desktop')
          $hadArchivistLnk = Test-Path "$desk\Archivist.lnk"
          $H = @{Origin='http://127.0.0.1:8775'}
          function Ping { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8775/api/ping).Content } catch { $null } }
          function WaitUp($sec) { for ($i=0; $i -lt $sec; $i++) { $p = Ping; if ($p) { return $p }; Start-Sleep 1 }; return $null }
          function Ctl($mode) { try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/api/app-control -Headers $H -ContentType 'application/json' -Body ('{"mode":"' + $mode + '","force":true}') | Out-Null } catch {} }
          $fail = @()
          $env:MEDIAENGINE_NO_BROWSER = '1'
          Start-Process wscript.exe -ArgumentList "`"$pkg\Start MediaEngine.vbs`""
          $ping = WaitUp 180
          if (-not $ping) { Get-ChildItem -Recurse $data -ErrorAction SilentlyContinue | Select-Object -First 30 FullName | Tee-Object -Append $log; exit 1 }
          "ping: $ping" | Tee-Object -Append $log
          if (-not $ping.Contains('3.13.0')) { $fail += 'version' }
          $auto = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto
          "auto page: HTTP $($auto.StatusCode), Quit button: $($auto.Content.Contains('quitBtn'))" | Tee-Object -Append $log
          if ($auto.StatusCode -ne 200 -or -not $auto.Content.Contains('quitBtn')) { $fail += 'auto page' }
          Start-Sleep 2
          $st = Get-Content "$data\data\update_status.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          "status: $($st.status) update_check: $($st.update_check)" | Tee-Object -Append $log
          if ($st.status -ne 'running' -or $st.update_check -ne 'updates_off') { $fail += 'update status' }
          "data outside the release: db=$(Test-Path "$data\data\archivist.db") release\data=$(Test-Path "$pkg\data")" | Tee-Object -Append $log
          if (-not (Test-Path "$data\data\archivist.db") -or (Test-Path "$pkg\data")) { $fail += 'data location' }
          $lnk = Test-Path "$desk\MediaEngine RC.lnk"
          "desktop shortcut 'MediaEngine RC': $lnk; stable shortcut touched: $((Test-Path "$desk\Archivist.lnk") -and -not $hadArchivistLnk)" | Tee-Object -Append $log
          if (-not $lnk -or ((Test-Path "$desk\Archivist.lnk") -and -not $hadArchivistLnk)) { $fail += 'shortcut' }
          if ((Test-Path "$pkg\Archivist.vbs") -or (Test-Path "$pkg\launcher")) { $fail += 'stable launcher files created' }
          # a project made in this release
          $folder = "$env:RUNNER_TEMP\fx\two"
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Method Post -Uri http://127.0.0.1:8775/auto/create -Headers $H -Body @{folder=$folder; length='5'; format='social_hd'; sound='auto'; mode='technical'}
            $made = $r.StatusCode -eq 200 -and $r.Content.Contains('/auto/p/1/')
          } catch { $made = $false; "create project error: $_" | Tee-Object -Append $log }
          "create project: $made" | Tee-Object -Append $log
          if (-not $made) { $fail += 'create project' }
          # second copy of the app on the same port must refuse to start (no second set of workers)
          $env:ARCHIVIST_V2_CHILD = '1'
          $p2 = Start-Process "$pkg\.venv\Scripts\python.exe" -ArgumentList '-s','-E',"`"$pkg\app\main.py`"",'--no-browser' -PassThru -RedirectStandardError "$env:OUT\second_copy_stderr.txt" -WindowStyle Hidden
          $exited = $p2.WaitForExit(90000)
          $err2 = Get-Content "$env:OUT\second_copy_stderr.txt" -Raw -ErrorAction SilentlyContinue
          "second copy exited: $exited code: $($p2.ExitCode) message: $($err2 -replace '\s+',' ')" | Tee-Object -Append $log
          if (-not $exited -or $p2.ExitCode -eq 0 -or -not (Ping)) { $fail += 'second copy' }
          Remove-Item Env:ARCHIVIST_V2_CHILD
          # restart through the app (same path as the Restart button)
          Ctl 'restart'; Start-Sleep 3
          $again = WaitUp 120
          "restart: $([bool]$again)" | Tee-Object -Append $log
          if (-not $again) { $fail += 'restart' }
          Ctl 'stop'; Start-Sleep 4
          "stopped: $(-not (Ping))" | Tee-Object -Append $log
          if (Ping) { $fail += 'quit' }
          # the next release, extracted elsewhere, opens the same projects
          Start-Process wscript.exe -ArgumentList "`"$pkg2\Start MediaEngine.vbs`""
          if (-not (WaitUp 180)) { $fail += 'next release start' } else {
            $home2 = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8775/auto).Content
            $seen = $home2.Contains("/auto/p/1")
            "next release sees the project: $seen; its own data folder created: $(Test-Path "$env:RUNNER_TEMP\pkg-test2\MediaEngine Data")" | Tee-Object -Append $log
            if (-not $seen -or (Test-Path "$env:RUNNER_TEMP\pkg-test2\MediaEngine Data")) { $fail += 'next release data' }
            Ctl 'stop'; Start-Sleep 4
          }
          Remove-Item "$desk\MediaEngine RC.lnk" -ErrorAction SilentlyContinue
          if ($fail.Count) { "FAILED: $($fail -join ', ')" | Tee-Object -Append $log; exit 1 }
          "package smoke PASS" | Tee-Object -Append $log
      - name: Package runtime runs the engine end to end, with the packaged Python blocked from the internet
        if: success()
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\pkg-test\MediaEngine Тест"
          $py = "$pkg\.venv\Scripts\python.exe"; $pyw = "$pkg\.venv\Scripts\pythonw.exe"
          $profiles = Get-NetFirewallProfile | Select-Object Name, Enabled
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName 'MediaEngine CI offline' -Direction Outbound -Program $py -Action Block | Out-Null
          New-NetFirewallRule -DisplayName 'MediaEngine CI offline w' -Direction Outbound -Program $pyw -Action Block | Out-Null
          try {
            & $py -s -E -c "import urllib.request; urllib.request.urlopen('https://www.microsoft.com', timeout=10)" 2>$null
            $blocked = ($LASTEXITCODE -ne 0)
            "internet blocked for the packaged Python: $blocked" | Tee-Object "$env:OUT\offline.txt"
            & $py -s -E -X utf8 mediaengine/tests/e2e_auto_edit.py --folder "$env:RUNNER_TEMP\fx\seven" --home "$env:RUNNER_TEMP\home-pkg" --mode technical --length 15 --skip-cancel --out "$env:OUT\e2e_packaged_python.json" 2>&1 | Tee-Object "$env:OUT\e2e_packaged_python.txt"
            $code = $LASTEXITCODE
          } finally {
            Remove-NetFirewallRule -DisplayName 'MediaEngine CI offline' -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName 'MediaEngine CI offline w' -ErrorAction SilentlyContinue
            foreach ($p in $profiles) { Set-NetFirewallProfile -Profile $p.Name -Enabled $p.Enabled }
          }
          if (-not $blocked) { "WARNING: the firewall did not block; the offline claim is NOT proven by this run" | Tee-Object -Append "$env:OUT\offline.txt" }
          if ($code -ne 0) { exit 1 }
      - name: Package is unchanged by the checks
        if: success()
        shell: pwsh
        run: |
          $src = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          $extra = @('data','launcher','Archivist.vbs','MediaArchive','Exports','Staging','Private','Rejected','config.json') | Where-Object { Test-Path (Join-Path $src.FullName $_) }
          if ($extra) { "created by running: $($extra -join ', ')"; exit 1 }
          "pristine" | Tee-Object "$env:OUT\package_pristine.txt"
      - name: Large phone-like footage (4K H.264, 4K HEVC, 5 min 1080p) - build time measured
        if: success()
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        run: |
          python mediaengine/tests/heavy_media_check.py "D:\me-heavy" 2>&1 | Tee-Object "$env:OUT\heavy_media.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload installable package (one ZIP named like the release folder inside it)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ runner.temp }}/pkg/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaengine-windows-ci
          path: ${{ runner.temp }}/me-ci/*
          if-no-files-found: warn
      - name: Publish results to branch mediaengine-ci-results
        if: success() || failure()
        shell: bash
        env:
          SRC_REF: ${{ github.ref_name }}
          SRC_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          out="$RUNNER_TEMP/me-ci"; pub="$RUNNER_TEMP/me-ci-pub"
          rm -rf "$pub"; mkdir -p "$pub/latest"
          cp "$out"/* "$pub/latest/" 2>/dev/null || true
          printf 'ref=%s\nsha=%s\nrun=%s\nstatus=%s\n' "$SRC_REF" "$SRC_SHA" "$RUN_ID" "$JOB_STATUS" > "$pub/latest/RUN.txt"
          cd "$pub"; git init -q; git checkout -q -b mediaengine-ci-results
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine windows ci run $RUN_ID ($SRC_REF $SRC_SHA) $JOB_STATUS"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-ci-results
