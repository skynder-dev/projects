name: reveng-contests
# A live run of RevEng's contest collector (reveng/ResearchLocal/contest_terms.py) on GitHub's machine: organizer pages
# and the secondary listing read with the app's own bounded transport (robots.txt, HTTPS, no redirects, request budget),
# terms quoted, standard library only (no bs4). Started by hand. The result (public contest terms only) is kept as the
# run's artifact for 14 days. No model calls.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect
        run: |
          mkdir -p "$RUNNER_TEMP/research"
          cd reveng/ResearchLocal && python -B contest_terms.py --root "$RUNNER_TEMP/research" | while IFS= read -r l; do echo "::notice::$l"; done
          python -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({'compatible':d['compatible'],'records':[{k:r.get(k) for k in ('key','origin','classification','declared_deadline','deadline_status','prize','fee','length_minutes','required_tool','facts','lead','error')} for r in d['records']],'listings':{k:{'classification':v.get('classification'),'error':v.get('error'),'leads':v.get('leads')} for k,v in d['listings'].items()}},ensure_ascii=False,indent=1))" "$RUNNER_TEMP/research/contest-terms.json"
      - name: Where do refused redirects point (diagnostics only, not used by the app)
        run: |
          python - "$RUNNER_TEMP/research/contest-terms.json" <<'PY'
          import json, sys, urllib.request
          for r in json.load(open(sys.argv[1]))['records']:
              if 'Redirect' in (r.get('error') or ''):
                  class N(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, *a, **k): return None
                  try: urllib.request.build_opener(N).open(urllib.request.Request(r['source_url'], method='HEAD'), timeout=20)
                  except urllib.error.HTTPError as e: print('::notice::' + r['key'] + ' -> ' + str(e.headers.get('Location')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: contest-terms
          path: |
            ${{ runner.temp }}/research/contest-terms.json
            ${{ runner.temp }}/research/contest-terms-view.json
          retention-days: 14
