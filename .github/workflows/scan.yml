name: reveng-scan
on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (1 cheap call) or full
        default: smoke
      per_family:
        description: candidates per family
        default: "4"
      resume:
        description: "optional: run folder name on the results branch to continue (e.g. run_20261010_031655); finished work is not paid for again"
        default: ""
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reveng
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tests
        run: node --test test/*.test.js
      - name: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p runs
          RESUME="${{ github.event.inputs.resume }}"
          if [ -n "$RESUME" ]; then
            git fetch --depth 1 origin results:refs/remotes/origin/results
            git checkout origin/results -- "runs/$RESUME"
          fi
          echo "key_present=$([ -n "$ANTHROPIC_API_KEY" ] && echo yes || echo no)" > runs/console.log
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            RESUME_ARG=""; [ -n "$RESUME" ] && RESUME_ARG="--resume runs/$RESUME"
            node src/cli.js run --config config.json --per-family "${{ github.event.inputs.per_family }}" --out runs $RESUME_ARG 2>&1 | tee -a runs/console.log
          else
            node src/cli.js smoke --config config.json --out runs 2>&1 | tee -a runs/console.log
          fi
      - name: publish results to branch
        if: always()
        run: |
          d=$(ls -d runs/run_* 2>/dev/null | tail -1)
          if [ -n "$d" ] && [ -f "$d/REPORT.md" ]; then cat "$d/REPORT.md" >> "$GITHUB_STEP_SUMMARY"; fi
          cat runs/console.log >> "$GITHUB_STEP_SUMMARY" || true
          rm -rf runs/*/cache
          git config user.name "reveng-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -B results
          git add -f runs
          git commit -m "scan results ${GITHUB_RUN_ID}" || true
          git push --force origin results
