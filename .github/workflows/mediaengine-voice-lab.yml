name: mediaengine-voice-lab
# Voice lab for MediaEngine's coming voice-over: free local engines say one English test text in a female American
# voice; every take is checked by machine (faster-whisper: the words really said; pitch; length) and the owner picks
# by ear, blind. CPU only (no GPU on GitHub runners). Synthetic voices only - no recordings of real people, no owner
# data, no secrets, nothing paid. Not the product: it decides which engine the product will use.
#
# Round 1 (run 39197836516, kept on branch mediaengine-voice-lab latest/): Kokoro, Qwen3-TTS VoiceDesign / Base,
# Chatterbox. The owner kept B, D, E ("still feels like AI, but good intonations").
# Round 2 (run 39209510581, results in round2/): the very takes B, D, E (from round 1's artifacts) + Chatterbox Turbo and
# VoxCPM2 with the same locked voice, all with the same voice-over finishing, alone and over free-licence music.
# Round 2 was too alike ("you just put random music") - three of five were round 1's very takes, all one voice.
# Round 3 (run 39214928456, results in round3/): the voice itself - a script written to be said, distinct characters,
# direction (VoxCPM2 style notes, a Turbo [chuckle]), no music. Earlier rounds' jobs are in git history; their
# voice_lab.py commands stay.
# Round 4 (this file, results in round4/): only 3.1 (VoxCPM2 designed "friend"), the one he found interesting - more
# diffusion steps, a sharper direction, best of six takes by UTMOS (checked against his verdicts), with and without a
# "microphone" finishing, and 3.1's voice locked on a new text (run 39226841245, results in round4/).
# Round 5 (this file, results in round5/ and ref/): the owner kept 4_2 and 4_4 ("3.1 sounds like sex, 4_5 squeaky,
# 4_3 tired"); their very takes become locked voices (FLAC in ref/, for the program) and say a business-info text,
# plain and with the microphone finishing. One CI job per take (30 steps on a CPU are slow). Run 39321688115.
# Round 7 (this file, results in round7/): 4_2's way of talking was liked but its voice is "squeaky"; shifting the
# finished sound was rejected ("as if drowned in a toilet"). So the MODEL says the business text lower in 4_2's voice:
# a style note on 4_2's timbre, a continuation from 4_2's recording made 2 semitones lower (PSOLA), 4_2's own recipe
# described lower. 4_2's recording is the program's assets/voice/host_4_2.flac. Run 39359044602.
# Round 8 (this file, results in round8/): 7_1 "good but squeaky", 7_2 / 7_3 "robot voice" - only 7_1's way, pushed
# further (a calmer note; 7_1 itself as the voice), more takes, the lowest natural take of each way picked by pitch.
# Run 39368973655: all 14 takes at 237-280 Hz (no lower than 7_1) - not sent.
# Round 9 (this file, results in round9/): 4_2's own recipe with other seeds (other, naturally lower voices), the three
# lowest natural ones sent; 7_1 locked the program's way on another text (a check), 7_1's recording as FLAC.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/voice_lab.py'
      - '.github/workflows/mediaengine-voice-lab.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: mediaengine-voice-lab-${{ github.ref }}
  cancel-in-progress: true
env:
  CPU_TORCH: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_PROGRESS_BAR: 'off'
  ROUND1_RUN: '39197836516'
  ROUND3_RUN: '39214928456'
  ROUND4_RUN: '39226841245'
  ROUND7_RUN: '39359044602'
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: r9_design, take: 1}
          - {variant: r9_design, take: 2}
          - {variant: r9_design, take: 3}
          - {variant: r9_design, take: 4}
          - {variant: r9_design, take: 5}
          - {variant: r9_design, take: 6}
          - {variant: r9_design, take: 7}
          - {variant: r9_design, take: 8}
          - {variant: r9_design, take: 9}
          - {variant: r9_design, take: 10}
          - {variant: r9_design, take: 11}
          - {variant: r9_design, take: 12}
          - {variant: r9_lock71, take: 1}
          - {variant: r9_lock71, take: 2}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'r9_lock71'
        with:
          name: voice7-r7_ctrl_lower-1
          path: ${{ runner.temp }}/r7
          run-id: ${{ env.ROUND7_RUN }}
          github-token: ${{ github.token }}
      - name: VoxCPM in its own venv (CPU torch; FFmpeg libraries for torchaudio's decoder)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" voxcpm soundfile
          if [ "${{ matrix.variant }}" = "r9_lock71" ]; then cp "$RUNNER_TEMP/r7/r7_ctrl_lower_t1.wav" "$RUNNER_TEMP/voice.wav"
          else ffmpeg -v error -i mediaengine/app/archivist/assets/voice/host_4_2.flac "$RUNNER_TEMP/voice.wav"; fi
      - name: One take (${{ matrix.variant }} ${{ matrix.take }}) of the business text
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py vox9one "$RUNNER_TEMP/out" ${{ matrix.variant }} ${{ matrix.take }} "$RUNNER_TEMP/voice.wav" 2>&1 | tee "$RUNNER_TEMP/out/${{ matrix.variant }}_${{ matrix.take }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice9-${{ matrix.variant }}-${{ matrix.take }}
          path: ${{ runner.temp }}/out
  finish:
    needs: [gen]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: voice9-*
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@v4
        with:
          name: voice7-r7_ctrl_lower-1
          path: ${{ runner.temp }}/r7
          run-id: ${{ env.ROUND7_RUN }}
          github-token: ${{ github.token }}
      - name: Checker in its own venv (faster-whisper 1.2.1, librosa)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q "faster-whisper==1.2.1" librosa scipy soundfile
      - name: Words and pitch, the three lowest natural voices - voice9_1..3; 7_1's recording as FLAC
        run: |
          mkdir -p "$RUNNER_TEMP/res/round9"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py round9 "$RUNNER_TEMP/in" "$RUNNER_TEMP/res/round9" 2>&1 | tee "$RUNNER_TEMP/res/round9/round9.txt"
          ffmpeg -v error -y -i "$RUNNER_TEMP/r7/r7_ctrl_lower_t1.wav" -c:a flac -compression_level 8 "$RUNNER_TEMP/res/round9/host_7_1.flac"
          sha256sum "$RUNNER_TEMP"/res/round9/*.flac > "$RUNNER_TEMP/res/round9/SHA256.txt"
      - name: Publish to branch mediaengine-voice-lab (round9/; earlier rounds stay)
        if: success() || failure()
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"
          git clone -q --depth 1 --branch mediaengine-voice-lab "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$pub"
          rm -rf "$pub/round9"; mkdir -p "$pub/round9"
          cp "$RUNNER_TEMP"/res/round9/* "$pub/round9/" 2>/dev/null || true
          printf 'run=%s\nsha=%s\n' "${{ github.run_id }}" "${{ github.sha }}" > "$pub/round9/RUN.txt"
          cd "$pub"; git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine voice lab round 9 run ${{ github.run_id }}"
          for i in 1 2 3; do git push -q origin HEAD:mediaengine-voice-lab && break; git pull -q --rebase origin mediaengine-voice-lab; done
