name: mediaengine-voice-lab
# Voice lab for MediaEngine's coming voice-over: free local engines say one English test text in a female American
# voice; every take is checked by machine (faster-whisper: the words really said; pitch; length) and the owner picks
# by ear, blind. CPU only (no GPU on GitHub runners). Synthetic voices only - no recordings of real people, no owner
# data, no secrets, nothing paid. Not the product: it decides which engine the product will use.
#
# Round 1 (run 39197836516, kept on branch mediaengine-voice-lab latest/): Kokoro, Qwen3-TTS VoiceDesign / Base,
# Chatterbox. The owner kept B, D, E ("still feels like AI, but good intonations").
# Round 2 (this file, results in round2/): the very takes B, D, E (from round 1's artifacts) + Chatterbox Turbo and
# VoxCPM2 with the same locked voice, all with the same voice-over finishing, alone and over free-licence music.
# The voice_lab.py commands of round 1 stay (kokoro / qwen / chatterbox / check) for a rerun from git history.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/voice_lab.py'
      - '.github/workflows/mediaengine-voice-lab.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: mediaengine-voice-lab-${{ github.ref }}
  cancel-in-progress: true
env:
  CPU_TORCH: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_PROGRESS_BAR: 'off'
  ROUND1_RUN: '39197836516'
jobs:
  turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The locked voice (round 1's reference)
        uses: actions/download-artifact@v4
        with:
          name: voice-qwen
          path: ${{ runner.temp }}/r1
          run-id: ${{ env.ROUND1_RUN }}
          github-token: ${{ github.token }}
      - name: Chatterbox (Turbo) in its own venv (CPU torch 2.6, its pin)
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" "torch==2.6.0" "torchaudio==2.6.0"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" chatterbox-tts soundfile
      - name: Turbo, locked voice, a [chuckle]
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" -m pip freeze > "$RUNNER_TEMP/out/freeze_turbo.txt"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py turbo "$RUNNER_TEMP/out" "$RUNNER_TEMP/r1/reference_locked_voice.wav" 2>&1 | tee "$RUNNER_TEMP/out/turbo.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice2-turbo
          path: ${{ runner.temp }}/out
  voxcpm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The locked voice (round 1's reference)
        uses: actions/download-artifact@v4
        with:
          name: voice-qwen
          path: ${{ runner.temp }}/r1
          run-id: ${{ env.ROUND1_RUN }}
          github-token: ${{ github.token }}
      - name: VoxCPM in its own venv (CPU torch; FFmpeg libraries for torchaudio's decoder)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" voxcpm soundfile
      - name: VoxCPM2, locked voice
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" -m pip freeze > "$RUNNER_TEMP/out/freeze_voxcpm.txt"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py voxcpm "$RUNNER_TEMP/out" "$RUNNER_TEMP/r1/reference_locked_voice.wav" 2>&1 | tee "$RUNNER_TEMP/out/voxcpm.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice2-voxcpm
          path: ${{ runner.temp }}/out
  finish:
    needs: [turbo, voxcpm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Round 1's takes (B, D, E as the owner heard them)
        uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          path: ${{ runner.temp }}/in/r1
          run-id: ${{ env.ROUND1_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: voice2-*
          path: ${{ runner.temp }}/in/r2
      - name: Checker and finishing in their own venv (faster-whisper 1.2.1, librosa, scipy)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q "faster-whisper==1.2.1" librosa scipy soundfile
      - name: Word check, best take, the same finishing, alone and over music, blind letters G-K
        run: |
          mkdir -p "$RUNNER_TEMP/res/round2"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py round2 "$RUNNER_TEMP/in" "$RUNNER_TEMP/res/round2" 2>&1 | tee "$RUNNER_TEMP/res/round2/round2.txt"
      - name: Publish to branch mediaengine-voice-lab (round2/, round 1 stays in latest/)
        if: success() || failure()
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"
          git clone -q --depth 1 --branch mediaengine-voice-lab "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$pub"
          rm -rf "$pub/round2"; mkdir -p "$pub/round2/logs"
          cp "$RUNNER_TEMP"/res/round2/*.mp3 "$RUNNER_TEMP"/res/round2/*.json "$RUNNER_TEMP"/res/round2/*.md "$RUNNER_TEMP"/res/round2/*.txt "$pub/round2/" 2>/dev/null || true
          for d in "$RUNNER_TEMP"/in/r2/*/; do
            n=$(basename "$d")
            for f in "$d"*.txt "$d"*.json; do [ -f "$f" ] && cp "$f" "$pub/round2/logs/${n}_$(basename "$f")"; done
          done
          printf 'sha=%s\nrun=%s\nstatus=%s\n' "$SRC_SHA" "$RUN_ID" "$JOB_STATUS" > "$pub/round2/RUN.txt"
          cd "$pub"
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine voice lab round 2 run $RUN_ID ($SRC_SHA) $JOB_STATUS"
          git push -q origin HEAD:mediaengine-voice-lab
