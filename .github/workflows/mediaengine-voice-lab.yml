name: mediaengine-voice-lab
# Voice lab for MediaEngine's coming voice-over: free local engines say one English test text in a female American
# voice; every take is checked by machine (faster-whisper: the words really said; pitch; length) and the owner picks
# by ear, blind. CPU only (no GPU on GitHub runners). Synthetic voices only - no recordings of real people, no owner
# data, no secrets, nothing paid. Not the product: it decides which engine the product will use.
#
# Round 1 (run 39197836516, kept on branch mediaengine-voice-lab latest/): Kokoro, Qwen3-TTS VoiceDesign / Base,
# Chatterbox. The owner kept B, D, E ("still feels like AI, but good intonations").
# Round 2 (run 39209510581, results in round2/): the very takes B, D, E (from round 1's artifacts) + Chatterbox Turbo and
# VoxCPM2 with the same locked voice, all with the same voice-over finishing, alone and over free-licence music.
# Round 2 was too alike ("you just put random music") - three of five were round 1's very takes, all one voice.
# Round 3 (run 39214928456, results in round3/): the voice itself - a script written to be said, distinct characters,
# direction (VoxCPM2 style notes, a Turbo [chuckle]), no music. Earlier rounds' jobs are in git history; their
# voice_lab.py commands stay.
# Round 4 (this file, results in round4/): only 3.1 (VoxCPM2 designed "friend"), the one he found interesting - more
# diffusion steps, a sharper direction, best of six takes by UTMOS (checked against his verdicts), with and without a
# "microphone" finishing, and 3.1's voice locked on a new text (run 39226841245, results in round4/).
# Round 5 (this file, results in round5/ and ref/): the owner kept 4_2 and 4_4 ("3.1 sounds like sex, 4_5 squeaky,
# 4_3 tired"); their very takes become locked voices (FLAC in ref/, for the program) and say a business-info text,
# plain and with the microphone finishing. One CI job per take (30 steps on a CPU are slow). Run 39321688115.
# Round 7 (this file, results in round7/): 4_2's way of talking was liked but its voice is "squeaky"; shifting the
# finished sound was rejected ("as if drowned in a toilet"). So the MODEL says the business text lower in 4_2's voice:
# a style note on 4_2's timbre, a continuation from 4_2's recording made 2 semitones lower (PSOLA), 4_2's own recipe
# described lower. 4_2's recording is the program's assets/voice/host_4_2.flac. Run 39359044602.
# Round 8 (this file, results in round8/): 7_1 "good but squeaky", 7_2 / 7_3 "robot voice" - only 7_1's way, pushed
# further (a calmer note; 7_1 itself as the voice), more takes, the lowest natural take of each way picked by pitch.
# Run 39368973655: all 14 takes at 237-280 Hz (no lower than 7_1) - not sent.
# Round 9 (this file, results in round9/): 4_2's own recipe with other seeds (other, naturally lower voices), the three
# lowest natural ones sent; 7_1 locked the program's way on another text (a check), 7_1's recording as FLAC.
# Run 39372109372. Round 10 (results in round10/, run 39396387033): 20 more seeds of the same recipe.
# Round 11 (results in round11/): 9_3 ("good but lisping") locked the program's way on other texts
# (English and Russian), each with the de-esser a / b. Run 39512712859.
# Round 12 (results in round12/, run 39515480136): 9_2 locked the program's way, 4 English takes + Russian.
# Round 13 (results in round13/): 9_2 locked was "too robotic" - three other ways to keep its voice; the owner: 13_3.
# Round 14 (this file, results in round14/): other free engines whose licence allows working use (CosyVoice3, Chatterbox
# Multilingual V3, NeuTTS Air, Qwen3-TTS Base), each cloning the very same 9_2 recording on round 13's text.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/voice_lab.py'
      - '.github/workflows/mediaengine-voice-lab.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: mediaengine-voice-lab-${{ github.ref }}
  cancel-in-progress: true
env:
  CPU_TORCH: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_PROGRESS_BAR: 'off'
  REF92: mediaengine/app/archivist/assets/voice/host_9_2.flac
jobs:
  cosy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fun-CosyVoice3 0.5B in its own venv (CPU torch 2.3.1; its requirements without the GPU-only ones)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox libsox-dev > /dev/null
          git clone -q --depth 1 --recursive https://github.com/FunAudioLLM/CosyVoice.git "$RUNNER_TEMP/cosy"
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --index-url "$CPU_TORCH" "torch==2.3.1" "torchaudio==2.3.1"
          grep -vE '^(--extra-index-url|deepspeed|onnxruntime|tensorrt|torch|gradio|fastapi|uvicorn|grpcio)' "$RUNNER_TEMP/cosy/requirements.txt" > "$RUNNER_TEMP/req.txt"
          printf 'torch==2.3.1\ntorchaudio==2.3.1\n' > "$RUNNER_TEMP/pin.txt"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" -c "$RUNNER_TEMP/pin.txt" -r "$RUNNER_TEMP/req.txt" "onnxruntime==1.18.0" huggingface_hub
          "$RUNNER_TEMP/v/bin/python" -c "from huggingface_hub import snapshot_download as d; d('FunAudioLLM/Fun-CosyVoice3-0.5B-2512', local_dir='$RUNNER_TEMP/cv3')"
          ffmpeg -v error -i "$REF92" -ac 1 "$RUNNER_TEMP/voice.wav"
      - name: CosyVoice3 cloning 9_2 (English takes 1-2, Russian take 9)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py cosy14 "$RUNNER_TEMP/out" "$RUNNER_TEMP/voice.wav" "$RUNNER_TEMP/cosy" "$RUNNER_TEMP/cv3" 2>&1 | tee "$RUNNER_TEMP/out/cosy.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice14-cosy
          path: ${{ runner.temp }}/out
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chatterbox Multilingual V3 in its own venv (CPU torch 2.6.0; the package from its GitHub, with V3)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --index-url "$CPU_TORCH" "torch==2.6.0" "torchaudio==2.6.0"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git" soundfile
          ffmpeg -v error -i "$REF92" -ac 1 "$RUNNER_TEMP/voice.wav"
      - name: Chatterbox cloning 9_2, default and livelier (English takes 1-2, Russian take 9)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py cb14 "$RUNNER_TEMP/out" "$RUNNER_TEMP/voice.wav" 2>&1 | tee "$RUNNER_TEMP/out/cb.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice14-chatterbox
          path: ${{ runner.temp }}/out
  neutts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: NeuTTS Air in its own venv (CPU torch; espeak-ng for its phonemes)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng cmake > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" neutts soundfile
          ffmpeg -v error -i "$REF92" -t 11.3 -ac 1 "$RUNNER_TEMP/voice_short.wav"
      - name: NeuTTS Air cloning the first 11.3 s of 9_2 (English takes 1-2)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py neu14 "$RUNNER_TEMP/out" "$RUNNER_TEMP/voice_short.wav" 2>&1 | tee "$RUNNER_TEMP/out/neu.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice14-neutts
          path: ${{ runner.temp }}/out
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qwen3-TTS in its own venv (CPU torch; sox for its audio tools)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox libsox-fmt-all > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" qwen-tts soundfile
          ffmpeg -v error -i "$REF92" -ac 1 "$RUNNER_TEMP/voice.wav"
      - name: Qwen3-TTS 1.7B Base cloning 9_2 (English takes 1-2, Russian take 9)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py qwen14 "$RUNNER_TEMP/out" "$RUNNER_TEMP/voice.wav" 2>&1 | tee "$RUNNER_TEMP/out/qwen.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice14-qwen
          path: ${{ runner.temp }}/out
  finish:
    needs: [cosy, chatterbox, neutts, qwen]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: voice14-*
          path: ${{ runner.temp }}/in
      - name: Checker in its own venv (faster-whisper 1.2.1, librosa); round 13's 13_3 (the program's voice today)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q "faster-whisper==1.2.1" librosa scipy soundfile
          git fetch -q --depth 1 origin mediaengine-voice-lab
          git show FETCH_HEAD:round13/voice13_3.mp3 > "$RUNNER_TEMP/now.mp3" || rm -f "$RUNNER_TEMP/now.mp3"
      - name: Words and pitch of each take - voice14_<n>[_ru]
        run: |
          mkdir -p "$RUNNER_TEMP/res/round14"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py round14 "$RUNNER_TEMP/in" "$RUNNER_TEMP/res/round14" "$REF92" "$RUNNER_TEMP/now.mp3" 2>&1 | tee "$RUNNER_TEMP/res/round14/round14.txt"
      - name: Publish to branch mediaengine-voice-lab (round14/; earlier rounds stay)
        if: success() || failure()
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"
          git clone -q --depth 1 --branch mediaengine-voice-lab "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$pub"
          rm -rf "$pub/round14"; mkdir -p "$pub/round14"
          cp "$RUNNER_TEMP"/res/round14/* "$pub/round14/" 2>/dev/null || true
          for f in "$RUNNER_TEMP"/in/*/*.txt; do [ -f "$f" ] && cp "$f" "$pub/round14/log_$(basename "$(dirname "$f")")_$(basename "$f")"; done
          printf 'run=%s\nsha=%s\n' "${{ github.run_id }}" "${{ github.sha }}" > "$pub/round14/RUN.txt"
          cd "$pub"; git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine voice lab round 14 run ${{ github.run_id }}"
          for i in 1 2 3; do git push -q origin HEAD:mediaengine-voice-lab && break; git pull -q --rebase origin mediaengine-voice-lab; done
