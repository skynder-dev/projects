name: mediaengine-voice-lab
# Voice lab for MediaEngine's coming voice-over: free local engines say one English test text in a female American
# voice; every take is checked by machine (faster-whisper: the words really said; pitch; length) and the owner picks
# by ear, blind. CPU only (no GPU on GitHub runners). Synthetic voices only - no recordings of real people, no owner
# data, no secrets, nothing paid. Not the product: it decides which engine the product will use.
#
# Round 1 (run 39197836516, kept on branch mediaengine-voice-lab latest/): Kokoro, Qwen3-TTS VoiceDesign / Base,
# Chatterbox. The owner kept B, D, E ("still feels like AI, but good intonations").
# Round 2 (run 39209510581, results in round2/): the very takes B, D, E (from round 1's artifacts) + Chatterbox Turbo and
# VoxCPM2 with the same locked voice, all with the same voice-over finishing, alone and over free-licence music.
# Round 2 was too alike ("you just put random music") - three of five were round 1's very takes, all one voice.
# Round 3 (run 39214928456, results in round3/): the voice itself - a script written to be said, distinct characters,
# direction (VoxCPM2 style notes, a Turbo [chuckle]), no music. Earlier rounds' jobs are in git history; their
# voice_lab.py commands stay.
# Round 4 (this file, results in round4/): only 3.1 (VoxCPM2 designed "friend"), the one he found interesting - more
# diffusion steps, a sharper direction, best of six takes by UTMOS (checked against his verdicts), with and without a
# "microphone" finishing, and 3.1's voice locked on a new text.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/voice_lab.py'
      - '.github/workflows/mediaengine-voice-lab.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: mediaengine-voice-lab-${{ github.ref }}
  cancel-in-progress: true
env:
  CPU_TORCH: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_PROGRESS_BAR: 'off'
  ROUND1_RUN: '39197836516'
  ROUND3_RUN: '39214928456'
jobs:
  vox4a:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Take 3.1 (round 3's raw file)
        uses: actions/download-artifact@v4
        with:
          name: voice3-vox
          path: ${{ runner.temp }}/r3
          run-id: ${{ env.ROUND3_RUN }}
          github-token: ${{ github.token }}
      - name: VoxCPM in its own venv (CPU torch; FFmpeg libraries for torchaudio's decoder)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" voxcpm soundfile
      - name: 3.1 at 30 steps, sharper direction, 3.1's voice on a new text
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py vox4a "$RUNNER_TEMP/out" "$RUNNER_TEMP/r3/vox_friend_t1.wav" 2>&1 | tee "$RUNNER_TEMP/out/vox4a.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice4-a
          path: ${{ runner.temp }}/out
  vox4b:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: VoxCPM in its own venv (CPU torch; FFmpeg libraries for torchaudio's decoder)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" voxcpm soundfile
      - name: Six takes of the sharper direction
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py vox4b "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/vox4b.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice4-b
          path: ${{ runner.temp }}/out
  finish:
    needs: [vox4a, vox4b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: voice4-*
          path: ${{ runner.temp }}/in
      - name: Earlier rounds' files (to check the naturalness predictor against the owner's verdicts)
        run: git clone -q --depth 1 --branch mediaengine-voice-lab "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/branch"
      - name: Checker in its own venv (faster-whisper 1.2.1, librosa, CPU torch for UTMOS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" torch torchaudio
          "$RUNNER_TEMP/v/bin/python" -m pip install -q --extra-index-url "$CPU_TORCH" "faster-whisper==1.2.1" librosa scipy soundfile
      - name: Words, pitch, UTMOS; best take; voice4_N.mp3
        run: |
          mkdir -p "$RUNNER_TEMP/res/round4"
          "$RUNNER_TEMP/v/bin/python" mediaengine/tests/voice_lab.py round4 "$RUNNER_TEMP/in" "$RUNNER_TEMP/res/round4" "$RUNNER_TEMP/branch" 2>&1 | tee "$RUNNER_TEMP/res/round4/round4.txt"
      - name: Publish to branch mediaengine-voice-lab (round4/; earlier rounds stay)
        if: success() || failure()
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"
          git clone -q --depth 1 --branch mediaengine-voice-lab "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$pub"
          rm -rf "$pub/round4"; mkdir -p "$pub/round4/logs"
          cp "$RUNNER_TEMP"/res/round4/*.mp3 "$RUNNER_TEMP"/res/round4/*.json "$RUNNER_TEMP"/res/round4/*.md "$RUNNER_TEMP"/res/round4/*.txt "$pub/round4/" 2>/dev/null || true
          for d in "$RUNNER_TEMP"/in/*/; do
            n=$(basename "$d")
            for f in "$d"*.txt "$d"*.json; do [ -f "$f" ] && cp "$f" "$pub/round4/logs/${n}_$(basename "$f")"; done
          done
          printf 'sha=%s\nrun=%s\nstatus=%s\n' "$SRC_SHA" "$RUN_ID" "$JOB_STATUS" > "$pub/round4/RUN.txt"
          cd "$pub"
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "mediaengine voice lab round 4 run $RUN_ID ($SRC_SHA) $JOB_STATUS"
          git push -q origin HEAD:mediaengine-voice-lab
