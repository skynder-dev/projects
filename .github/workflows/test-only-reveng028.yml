name: test-only-reveng028
on:
  pull_request:
    paths: ['.ci/test-only/**', '.github/workflows/*.yml', '.github/workflows/*.yaml', 'FILE_MANIFEST.json', 'README.txt', 'LOCAL_VALIDATION.json', 'SENSITIVE_DATA_REVIEW.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4==4.15.0
      - run: python -m pip install --only-binary=PyYAML --no-deps PyYAML==6.0.3
      - run: python -B .ci/test-only/harness/verify_files.py
      - run: python -B .ci/test-only/harness/test_recovery_workflow_gates.py
      - run: python -B .ci/test-only/harness/test_workflow_paths.py
      - run: python -X utf8 -B .ci/test-only/harness/run.py reveng028
        shell: powershell
