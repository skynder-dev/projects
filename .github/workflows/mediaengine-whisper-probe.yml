name: mediaengine-whisper-probe
# A research probe for the captions of "Clips from a long video" and Voice-over: how many words of a real interview
# would a bigger free Whisper model (faster-whisper; distil-large-v3, large-v3-turbo, large-v3) hear differently from
# the voice add-on's "small"? A 9-minute public-domain NASA interview (Wikimedia Commons, pinned SHA-256), Linux CPU,
# int8. Not part of the program; nothing paid. Results: branch mediaengine-whisper-probe (whisper_probe.md / .json).
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/whisper_probe.py'
      - '.github/workflows/mediaengine-whisper-probe.yml'
permissions:
  contents: write
concurrency:
  group: mediaengine-whisper-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: faster-whisper as in the voice add-on
        run: python -m pip install --disable-pip-version-check -q faster-whisper==1.2.1 ctranslate2==4.8.3
      - name: Each model hears the interview
        run: python mediaengine/tests/whisper_probe.py --out "$RUNNER_TEMP/out" --work "$RUNNER_TEMP/work" 2>&1 | tee "$RUNNER_TEMP/out_log.txt"
      - name: Publish to branch mediaengine-whisper-probe
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir -p "$pub"
          cp "$RUNNER_TEMP"/out/*.json "$RUNNER_TEMP"/out/*.md "$pub/" 2>/dev/null || true
          cp "$RUNNER_TEMP/out_log.txt" "$pub/" 2>/dev/null || true
          printf 'sha=%s\nrun=%s\n' "$SRC_SHA" "$RUN_ID" > "$pub/RUN.txt"
          cd "$pub"; git init -q; git checkout -q -b mediaengine-whisper-probe
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "whisper probe $RUN_ID ($SRC_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-whisper-probe
