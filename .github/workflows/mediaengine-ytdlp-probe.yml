name: mediaengine-ytdlp-probe
# A research probe for a "Download by a link" button: yt-dlp (the free, open downloader) - its Windows build from the
# release, checked against the release's own SHA-256 list - downloads a few public test videos and lists a channel's
# videos with the arguments the program would use. Only the figures are published (sizes, lengths, errors), never the
# videos. Not part of the program; nothing paid. Results: branch mediaengine-ytdlp-lab.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/ytdlp_probe.py'
      - '.github/workflows/mediaengine-ytdlp-probe.yml'
permissions:
  contents: write
concurrency:
  group: mediaengine-ytdlp-probe-${{ github.ref }}
  cancel-in-progress: true
env:
  YTDLP_TAG: '2026.10.26'
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The program's own packages (its FFmpeg)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q -r mediaengine/requirements.txt
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
      - name: yt-dlp's Windows build of the release, checked against its SHA-256 list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/ytdlp"; mkdir -p "$d"; cd "$d"
          gh release download -R yt-dlp/yt-dlp "$YTDLP_TAG" -p yt-dlp.exe -p SHA2-256SUMS
          want=$(grep -E ' yt-dlp\.exe$' SHA2-256SUMS | cut -d' ' -f1)
          have=$(sha256sum yt-dlp.exe | cut -d' ' -f1)
          size=$(stat -c %s yt-dlp.exe)
          printf 'tag=%s\nfile=yt-dlp.exe\nsize=%s\nsha256=%s\nlisted=%s\n' "$YTDLP_TAG" "$size" "$have" "$want" | tee "$RUNNER_TEMP/out/ytdlp_release.txt"
          [ "$want" = "$have" ]
      - name: Download the test videos, list a channel
        shell: pwsh
        run: |
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          python mediaengine/tests/ytdlp_probe.py --exe "$env:RUNNER_TEMP\ytdlp\yt-dlp.exe" --ffmpeg "$ff" --out "$env:RUNNER_TEMP\out" 2>&1 | Tee-Object "$env:RUNNER_TEMP\out\probe_console.txt"
      - name: Publish to branch mediaengine-ytdlp-lab
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir -p "$pub"
          cp "$RUNNER_TEMP"/out/*.txt "$RUNNER_TEMP"/out/*.json "$pub/" 2>/dev/null || true
          printf 'run=%s\nsha=%s\nstatus=%s\n' "$RUN_ID" "$SRC_SHA" "${{ job.status }}" > "$pub/RUN.txt"
          cd "$pub"; git init -q; git checkout -q -b mediaengine-ytdlp-lab
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "ytdlp probe $RUN_ID ($SRC_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-ytdlp-lab
