name: mediaengine-clips-judge
# A research probe for "Clips from a long video": would a small free local language model (Qwen3, Apache-2.0, from
# Hugging Face) choose better clips than the program's word counting? It reads the clips found in a public-domain NASA
# interview by the voice add-on check (branch mediaengine-voice-lab, addon/clips_found.json) and marks each one.
# Linux CPU runner (the marks, not Windows, are the question). Not part of the program; nothing paid.
# Results: branch mediaengine-clips-judge (judge_probe.json, judge_probe.md).
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/clips_judge_probe.py'
      - '.github/workflows/mediaengine-clips-judge.yml'
permissions:
  contents: write
concurrency:
  group: mediaengine-clips-judge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Packages (CPU torch, transformers as in the voice add-on)
        run: |
          python -m pip install --disable-pip-version-check -q torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -q transformers==5.20.1
      - name: The clips found in the NASA interview
        run: |
          git fetch -q --depth 1 origin +refs/heads/mediaengine-voice-lab:refs/remotes/origin/mediaengine-voice-lab
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          git show origin/mediaengine-voice-lab:addon/clips_found.json > "$RUNNER_TEMP/in/clips_found.json"
      - name: Marks of each model
        run: python mediaengine/tests/clips_judge_probe.py --found "$RUNNER_TEMP/in/clips_found.json" --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/judge_probe.txt"
      - name: Publish to branch mediaengine-clips-judge
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
        run: |
          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir -p "$pub"
          cp "$RUNNER_TEMP"/out/* "$pub/" 2>/dev/null || true
          printf 'sha=%s\nrun=%s\n' "$SRC_SHA" "$RUN_ID" > "$pub/RUN.txt"
          cd "$pub"; git init -q; git checkout -q -b mediaengine-clips-judge
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "clips judge probe $RUN_ID ($SRC_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-clips-judge
