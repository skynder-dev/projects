name: mediaengine-writer-probe
# A research probe for Cartoon Studio's story writer: which free local model writes the program's plain-text cartoon
# stories well enough (from a topic, from a text, retold for another country)? The program's own requests
# (cartoon/writer.py) sent to llama.cpp's server (MIT, the release build the program pins) on the runner's processor,
# one job per model: Qwen3-4B-Instruct-2507 Q8_0 (the program's) and Qwen3-14B Q4_K_M (Apache-2.0, a bigger one for
# a graphics card with 12 GB). Not part of the program; nothing paid. Results: branch mediaengine-writer-lab
# (<model>/writer_probe.md, the stories, a picture per scene).
on:
  workflow_dispatch:
  push:
    paths:
      - 'mediaengine/tests/writer_probe.py'
      - '.github/workflows/mediaengine-writer-probe.yml'
permissions:
  contents: write
env:
  # the tasks of this run (empty: all of them)
  PROBE_ONLY: 'ru_translit,en_translit,ro_translit'
concurrency:
  group: mediaengine-writer-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: qwen3-4b-instruct-2507-q8_0
            repos: ggml-org/Qwen3-4B-Instruct-2507-Q8_0-GGUF
            want: q8_0
          - label: qwen3-14b-q4_k_m
            repos: Qwen/Qwen3-14B-GGUF,ggml-org/Qwen3-14B-GGUF,unsloth/Qwen3-14B-GGUF,lmstudio-community/Qwen3-14B-GGUF
            want: q4_k_m
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Packages for drawing the scenes
        run: python -m pip install --disable-pip-version-check -q numpy opencv-python-headless pillow
      - name: llama.cpp b11941 (the Linux processor build of the release the program pins, SHA-256 checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/llama"; cd "$RUNNER_TEMP/llama"
          gh release download -R ggml-org/llama.cpp b11941 -p llama-b11941-bin-ubuntu-x64.tar.gz
          echo "e8a1ee13aa19c6c78f5651457758160da27410301b179d6ef3505c81c8ea31f1  llama-b11941-bin-ubuntu-x64.tar.gz" | sha256sum -c
          tar xzf llama-b11941-bin-ubuntu-x64.tar.gz
          srv=$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -1)
          echo "LLAMA_SERVER=$srv" >> "$GITHUB_ENV"; echo "LLAMA_LIB=$(dirname "$srv")" >> "$GITHUB_ENV"
      - name: The model (the repository's commit pinned, SHA-256 checked)
        env:
          REPOS: ${{ matrix.repos }}
          WANT: ${{ matrix.want }}
        run: |
          python - "$RUNNER_TEMP/out/model.json" <<'PY'
          import json, os, sys, urllib.request
          for repo in os.environ["REPOS"].split(","):
              try:
                  with urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}?blobs=true", timeout=60) as r:
                      info = json.load(r)
              except Exception as exc:
                  print(repo, "-", exc)
                  continue
              files = [s for s in info.get("siblings") or [] if s["rfilename"].lower().endswith(".gguf")
                       and os.environ["WANT"] in s["rfilename"].lower()]
              if files:
                  f = files[0]
                  pick = {"repo": repo, "sha": info.get("sha"), "file": f["rfilename"], "size": f.get("size"),
                          "sha256": (f.get("lfs") or {}).get("sha256"), "license": (info.get("cardData") or {}).get("license")}
                  print(pick)
                  json.dump(pick, open(sys.argv[1], "w"), indent=1)
                  break
          PY
          repo=$(jq -r .repo "$RUNNER_TEMP/out/model.json"); sha=$(jq -r .sha "$RUNNER_TEMP/out/model.json")
          file=$(jq -r .file "$RUNNER_TEMP/out/model.json"); want=$(jq -r .sha256 "$RUNNER_TEMP/out/model.json")
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/model.gguf" "https://huggingface.co/$repo/resolve/$sha/$file"
          echo "$want  $RUNNER_TEMP/model.gguf" | sha256sum -c
      - name: The server
        run: |
          export LD_LIBRARY_PATH="$LLAMA_LIB:$LD_LIBRARY_PATH"
          nohup "$LLAMA_SERVER" -m "$RUNNER_TEMP/model.gguf" -c 8192 -np 1 --host 127.0.0.1 --port 8090 --jinja --no-webui \
            > "$RUNNER_TEMP/out/server.log" 2>&1 &
          for i in $(seq 1 300); do
            if curl -sf http://127.0.0.1:8090/health >/dev/null; then echo "up after $i s"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8090/health || { tail -40 "$RUNNER_TEMP/out/server.log"; exit 1; }
      - name: The stories
        run: python mediaengine/tests/writer_probe.py --server http://127.0.0.1:8090 --out "$RUNNER_TEMP/out" --label "${{ matrix.label }}" --only "$PROBE_ONLY" 2>&1 | tee "$RUNNER_TEMP/out/writer_probe.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-${{ matrix.label }}
          path: ${{ runner.temp }}/out
  publish:
    needs: writer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/pub
      - name: Publish to branch mediaengine-writer-lab
        env:
          RUN_ID: ${{ github.run_id }}
          SRC_SHA: ${{ github.sha }}
        run: |
          cd "$RUNNER_TEMP/pub"
          for d in writer-*; do [ -d "$d" ] && mv "$d" "${d#writer-}"; done
          printf 'sha=%s\nrun=%s\n' "$SRC_SHA" "$RUN_ID" > RUN.txt
          git init -q; git checkout -q -b mediaengine-writer-lab
          git config user.name "mediaengine-ci"; git config user.email "mediaengine-ci@users.noreply.github.com"
          git add -A; git commit -q -m "writer probe $RUN_ID ($SRC_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mediaengine-writer-lab
